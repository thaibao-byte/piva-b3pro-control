<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>PIVA B3PRO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;touch-action:manipulation}
button,input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.top h1{margin:0;font-size:18px}
.ib{width:40px;height:40px;border:0;background:0;font-size:22px}
.hero{text-align:center;padding:6px 16px}
.logo{width:150px;height:150px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800;background:conic-gradient(#ff4d4d,#ffd166,#22c55e,#38bdf8,#a78bfa,#ff4d4d)}
.st{display:flex;justify-content:center;gap:6px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:#e5e7eb;color:#fff;display:grid;place-items:center;font-size:10px}
.dot.ok{background:#22c55e}
.box{padding:0 12px 28px}
.warn{background:#fff7ed;color:#9a3412;border-radius:12px;padding:10px;font-size:12px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:700;font-size:13px}
.g{background:#22c55e;color:#fff}
.n{background:#f3f4f6}
.k{background:#111;color:#fff}
.btn:disabled{opacity:.45}
.log{background:#0b1220;color:#bbf7d0;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
h2{font-size:14px;margin:16px 0 8px}
.hint{color:#6b7280;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px}
.val{font-weight:800;text-align:center}
</style>
</head>
<body>
<div class="top"><button class="ib" id="back" type="button">‹</button><h1>B3PRO</h1><span></span></div>
<div class="hero">
  <div class="logo">A</div>
  <div class="st"><span class="dot" id="dot">✓</span><span id="conn">Chưa kết nối</span></div>
  <div class="val" id="rpm">— RPM</div>
</div>
<div class="box">
  <div class="warn">Bản dò mới: ghi lần lượt mọi kênh, nhận trên mọi kênh notify. Lần trước ghi nhầm kênh phụ 6DAA nên máy im.</div>
  <h2>Kết nối</h2>
  <div class="row">
    <button class="btn g" id="connect" type="button">Kết nối B3PRO</button>
    <button class="btn n" id="scan" type="button">Quét tất cả</button>
    <button class="btn n" id="dis" type="button">Ngắt</button>
  </div>
  <div class="row">
    <button class="btn k" id="probe" type="button">Tự dò mọi kênh</button>
    <button class="btn n" id="stop" type="button">Dừng</button>
    <button class="btn n" id="copy" type="button">Chép nhật ký</button>
  </div>
  <div class="hint" id="info">Chưa chọn thiết bị.</div>
  <h2>Nhật ký</h2>
  <div class="log" id="log"></div>
  <div class="row"><button class="btn n" id="clr" type="button">Xóa nhật ký</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var SVC="49535343-fe7d-4ae5-8fa9-9fafd205e455";
var PREF_W="49535343-8841-43f4-a8d4-ecbe34729bb3";
var OPT=[SVC,"generic_access","device_information"];
var st={ok:false,dev:null,writes:[],notifies:[],busy:false,stop:false,lastRx:0,hits:0};
function $(id){return document.getElementById(id)}
function log(m){var el=$("log");el.textContent+="["+new Date().toLocaleTimeString("vi-VN")+"] "+m+"\n";el.scrollTop=el.scrollHeight}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2000)}
function hex(u){return Array.from(u).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(" ").toUpperCase()}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function shortU(u){return String(u).toLowerCase()}
function propsOf(c){var p=c.properties||{},o=[];for(var k in p)if(p[k])o.push(k);return o.join(",")}
function xor(a){var x=0;for(var i=0;i<a.length;i++)x^=a[i];return x}
function sum(a){var x=0;for(var i=0;i<a.length;i++)x=(x+a[i])&255;return x}
function a55a(cmd){var p=[0xA5,0x5A,2,cmd,0];p.push(xor(p.slice(2)));return p}
function aa55(cmd){var p=[0xAA,0x55,2,cmd,0];p.push(sum(p.slice(2)));return p}
function guess(bytes){
  for(var i=0;i<bytes.length-1;i++){
    var le=bytes[i]|(bytes[i+1]<<8);
    if(le>=800&&le<=9000){$("rpm").textContent=le+" RPM";return}
  }
}
async function writeChar(c,arr){
  var u=new Uint8Array(arr);
  var p=c.properties||{};
  if(p.writeWithoutResponse&&c.writeValueWithoutResponse)await c.writeValueWithoutResponse(u);
  else await c.writeValue(u);
}
function onNotify(name){
  return function(ev){
    var u=new Uint8Array(ev.target.value.buffer);
    st.lastRx=Date.now();st.hits++;
    log("Nhận @"+name+" · "+hex(u));
    guess(u);
  };
}
async function attach(dev){
  st.dev=dev;st.writes=[];st.notifies=[];
  $("info").textContent="Thiết bị: "+(dev.name||"(không tên)");
  log("Chọn "+(dev.name||dev.id));
  var server=await dev.gatt.connect();
  log("Đã vào GATT");
  var services=[];
  try{services.push(await server.getPrimaryService(SVC))}catch(e){}
  if(!services.length)services=await server.getPrimaryServices();
  for(var i=0;i<services.length;i++){
    var svc=services[i];
    var chars=await svc.getCharacteristics();
    log("Dịch vụ "+svc.uuid);
    for(var k=0;k<chars.length;k++){
      var c=chars[k],p=c.properties||{};
      log("  CHAR "+c.uuid+" ["+propsOf(c)+"]");
      if(p.write||p.writeWithoutResponse)st.writes.push(c);
      if(p.notify||p.indicate){
        try{
          await c.startNotifications();
          c.addEventListener("characteristicvaluechanged",onNotify(c.uuid.slice(9,13)));
          st.notifies.push(c);
          log("  → đã bật nhận");
        }catch(e){log("  → không bật nhận: "+(e.message||e))}
      }
    }
  }
  st.writes.sort(function(a,b){return (shortU(b.uuid)===PREF_W)-(shortU(a.uuid)===PREF_W)});
  if(!st.writes.length)throw new Error("Không có kênh ghi");
  log("Số kênh ghi: "+st.writes.length+" · kênh nhận: "+st.notifies.length);
  st.ok=true;$("dot").className="dot ok";$("conn").textContent="Đã kết nối";
  toast("Đã kết nối");
}
async function ask(all){
  if(!navigator.bluetooth){toast("Cần Chrome Android + HTTPS");return}
  try{
    var opt=all?{acceptAllDevices:true,optionalServices:OPT}:{filters:[{namePrefix:"B3"},{namePrefix:"PIVA"},{namePrefix:"B3PRO"},{services:[SVC]}],optionalServices:OPT};
    await attach(await navigator.bluetooth.requestDevice(opt));
  }catch(e){
    var msg=e&& (e.message||e.name)||"không rõ";
    if(e&&e.name==="NotFoundError"){log("Không chọn máy");toast("Không thấy máy — Quét tất cả")}
    else log("Lỗi: "+msg);
  }
}
function payloads(){
  return [
    {t:"01",b:[1]},
    {t:"00",b:[0]},
    {t:"02 01",b:[2,1]},
    {t:"A55A-1",b:a55a(1)},
    {t:"AA55-1",b:aa55(1)},
    {t:"55 AA 01 00",b:[0x55,0xAA,1,0,0x56]},
    {t:"FE 01",b:[0xFE,1]}
  ];
}
async function runProbe(){
  if(!st.ok){toast("Kết nối trước");return}
  if(st.busy)return;
  st.busy=true;st.stop=false;st.hits=0;
  $("probe").disabled=true;
  var pays=payloads();
  log("Dò "+st.writes.length+" kênh ghi × "+pays.length+" gói");
  for(var w=0;w<st.writes.length;w++){
    if(st.stop)break;
    var ch=st.writes[w];
    log("--- Ghi kênh "+ch.uuid+" ---");
    for(var i=0;i<pays.length;i++){
      if(st.stop)break;
      var before=st.lastRx;
      try{
        log("Thử "+pays[i].t+" → "+hex(pays[i].b));
        await writeChar(ch,pays[i].b);
        await sleep(320);
        if(st.lastRx>before)log("→ Có phản hồi trên kênh này");
      }catch(e){log("Lỗi ghi: "+(e.message||e));await sleep(180)}
    }
  }
  log("Xong. Số lần nhận: "+st.hits);
  st.busy=false;$("probe").disabled=false;toast("Xong dò");
}
$("connect").onclick=function(){ask(false)};
$("scan").onclick=function(){ask(true)};
$("dis").onclick=function(){st.stop=true;try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}st.ok=false;$("dot").className="dot";$("conn").textContent="Chưa kết nối";toast("Đã ngắt")};
$("back").onclick=function(){if(st.ok)$("dis").click();else $("connect").click()};
$("probe").onclick=runProbe;
$("stop").onclick=function(){st.stop=true};
$("copy").onclick=function(){
  var t=$("log").textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Đã chép")});
};
$("clr").onclick=function(){$("log").textContent=""};
log("Bản dò kênh đầy đủ. Kết nối rồi bấm Tự dò mọi kênh.");
})();
</script>
</body>
</html>
