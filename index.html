<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PIVA B3 Pro Control</title>
  <style>
    :root { --bg:#07080c; --card:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12); --text:#f4f6fb; --muted:#9aa3b5; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.35),transparent 55%),#07080c}
    .wrap{max-width:980px;margin:0 auto;padding:24px 18px 48px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fff;color:#111;font-weight:800}
    .brand{display:flex;gap:12px;align-items:center}
    .sub{color:var(--muted);font-size:12px}
    .status{font-size:12px;padding:8px 12px;border-radius:999px;border:1px solid var(--stroke)}
    .status.on{color:#7dffb3}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
    @media(max-width:820px){.grid{grid-template-columns:1fr}}
    .card{background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:24px;padding:20px}
    .device{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .ring{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff3b3b,#ffb000,#2dff7e,#00d4ff,#6a5cff,#ff3bd4,#ff3b3b);padding:14px;animation:spin 8s linear infinite;animation-play-state:paused}
    .ring.live{animation-play-state:running}
    .core{width:100%;height:100%;border-radius:50%;background:#f4f6fb;display:grid;place-items:center;color:#1a1d27}
    .core b{font-size:64px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;width:100%}
    .stat{background:rgba(0,0,0,.25);border-radius:16px;padding:12px;text-align:center}
    .stat span{display:block;color:var(--muted);font-size:11px}
    button{cursor:pointer;color:#fff;background:#171923;border:1px solid var(--stroke);border-radius:14px;padding:12px 14px;font-weight:600}
    button.primary{background:linear-gradient(135deg,#7c5cff,#4aa8ff);border:0}
    button.danger{background:#2a1218;color:#ff8ea3}
    button.active{outline:2px solid #7c5cff}
    .row,.levels{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .levels{display:grid;grid-template-columns:repeat(4,1fr)}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 8px}
    input[type=range]{width:100%}
    .log{height:120px;overflow:auto;font:12px/1.5 ui-monospace,monospace;background:rgba(0,0,0,.35);border-radius:14px;padding:10px;color:#b8c0d4}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">A</div><div><h1>PIVA B3 Pro</h1><div class="sub">BornforEsports · 25W</div></div></div>
    <div id="bleStatus" class="status">Chua ket noi</div>
  </header>
  <div class="grid">
    <section class="card device">
      <div id="ring" class="ring"><div class="core"><b>A</b></div></div>
      <div class="stats">
        <div class="stat"><span>Nhiet do</span><strong id="tempVal">--C</strong></div>
        <div class="stat"><span>Quat</span><strong id="rpmVal">0 RPM</strong></div>
        <div class="stat"><span>Cong suat</span><strong id="wattVal">0W</strong></div>
      </div>
    </section>
    <section class="card">
      <div class="row">
        <button class="primary" id="btnConnect">Ket noi Bluetooth</button>
        <button id="btnDemo">Gia lap</button>
        <button class="danger" id="btnPower">Tat</button>
      </div>
      <label>Muc lam lanh</label>
      <div class="levels">
        <button data-level="1">ECO</button>
        <button data-level="2">NORM</button>
        <button data-level="3">GAME</button>
        <button data-level="4">TURBO</button>
      </div>
      <label>Toc do quat: <span id="speedLabel">40%</span></label>
      <input id="speed" type="range" min="0" max="100" value="40" />
      <label>RGB</label>
      <div class="row">
        <button data-rgb="off">Off</button>
        <button data-rgb="static">Static</button>
        <button data-rgb="breath">Breath</button>
        <button data-rgb="rainbow" class="active">Rainbow</button>
      </div>
      <input id="color" type="color" value="#7c5cff" style="width:100%;height:42px;border:0;background:transparent" />
      <div class="log" id="log"></div>
    </section>
  </div>
</div>
<script>
const LEVELS={1:{rpm:1800,watt:8},2:{rpm:2800,watt:14},3:{rpm:4200,watt:20},4:{rpm:5454,watt:25}};
const state={on:false,demo:false,level:2,speed:40,rgb:'rainbow',device:null,characteristic:null};
const $=id=>document.getElementById(id);
const log=msg=>{const el=$('log');el.textContent=`[${new Date().toLocaleTimeString()}] ${msg}\n`+el.textContent;};
function render(){
  $('ring').classList.toggle('live',state.on&&state.rgb!=='off');
  $('bleStatus').textContent=state.device?'BLE':state.demo?'Demo':'Off';
  $('bleStatus').classList.toggle('on',!!(state.device||state.demo));
  $('btnPower').textContent=state.on?'Tat':'Bat';
  const spec=LEVELS[state.level];
  const rpm=state.on?Math.round(spec.rpm*(0.4+state.speed/160)):0;
  const watt=state.on?(spec.watt*(0.45+state.speed/180)).toFixed(1):'0';
  const temp=state.on?(36-state.level*3-state.speed/25).toFixed(1):'--';
  $('rpmVal').textContent=rpm+' RPM';
  $('wattVal').textContent=watt+'W';
  $('tempVal').textContent=temp==='--'?'--C':temp+'C';
  $('speedLabel').textContent=state.speed+'%';
}
async function send(cmd,payload={}){
  const packet=JSON.stringify({cmd,...payload,ts:Date.now()});
  log('TX '+packet);
  if(state.characteristic){try{await state.characteristic.writeValue(new TextEncoder().encode(packet));}catch(e){log(e.message);}}
}
$('btnDemo').onclick=()=>{state.demo=true;state.on=true;render();send('power',{on:true});};
$('btnPower').onclick=()=>{state.on=!state.on;render();send('power',{on:state.on});};
document.querySelectorAll('[data-level]').forEach(btn=>btn.onclick=()=>{state.level=+btn.dataset.level;document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();send('level',{level:state.level});});
document.querySelectorAll('[data-rgb]').forEach(btn=>btn.onclick=()=>{state.rgb=btn.dataset.rgb;document.querySelectorAll('[data-rgb]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();send('rgb',{mode:state.rgb,color:$('color').value});});
$('speed').oninput=e=>{state.speed=+e.target.value;render();};
$('speed').onchange=()=>send('speed',{speed:state.speed});
$('btnConnect').onclick=async()=>{
  if(!navigator.bluetooth){log('Can Chrome + HTTPS/localhost');return;}
  try{
    const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['generic_access','battery_service']});
    state.device=device;
    const server=await device.gatt.connect();
    const services=await server.getPrimaryServices();
    log('GATT '+device.name+' services '+services.map(s=>s.uuid).join(', '));
    render();
  }catch(e){log(e.message);}
};
document.querySelector('[data-level="2"]').classList.add('active');
render();
log('Ready. Demo mode works. Real BLE UUID still missing from APK.');
</script>
</body>
</html>
