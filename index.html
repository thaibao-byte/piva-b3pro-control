<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>B3PRO Lab</title>
<style>
:root{--bg:#07090f;--card:#12151e;--line:#1e2433;--txt:#e8edf7;--dim:#8b93a7;--cy:#2ee6ff;--rd:#ff3b4a;--ok:#22d37a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;background:radial-gradient(120% 55% at 50% -8%,#1a2744 0%,var(--bg) 52%)}
button,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.brand{font-size:10px;letter-spacing:.18em;color:var(--cy);font-weight:800}
.top h1{margin:0;font-size:15px;font-weight:800}
.ib{width:36px;height:36px;border:0;background:0;font-size:22px;color:var(--txt)}
.stage{position:relative;width:280px;height:268px;margin:0 auto}
.ring{position:absolute;left:36px;top:18px;width:208px;height:208px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff3b4a,#ffb000,#2ee6ff,#7a5cff,#ff3b4a);box-shadow:0 0 26px rgba(46,230,255,.2);transition:opacity .3s,filter .3s}
.ring i{position:absolute;inset:8px;border-radius:50%;background:#0b0d14;padding:8px;display:block}
.cool{width:100%;height:100%;object-fit:contain}
.ring.fx-flow::before{animation:spin var(--ring-spd,3.6s) linear infinite}
.ring.fx-chase::before{animation:spin var(--ring-spd,2s) linear infinite;filter:saturate(1.4) brightness(1.05)}
.ring.fx-star::before{animation:spin var(--ring-spd,2.8s) linear infinite;background:conic-gradient(from 0deg,#fff 0 6%,transparent 6% 14%,#2ee6ff 14% 20%,transparent 20% 28%,#ff3b4a 28% 34%,transparent 34% 42%,#ffb000 42% 48%,transparent 48% 56%,#7a5cff 56% 62%,transparent 62% 70%,#2ee6ff 70% 76%,transparent 76% 100%)}
.ring.fx-breath::before{animation:breath var(--ring-spd,2.6s) ease-in-out infinite;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 34px var(--ring-col,#8000FF)}
.ring.fx-soft::before{animation:breath var(--ring-spd,3.4s) ease-in-out infinite;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 22px var(--ring-col,#8000FF)}
.ring.fx-solid::before{animation:none;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 22px var(--ring-col,#8000FF);opacity:1}
.ring.fx-off::before{animation:none!important;background:#252a38!important;box-shadow:none;opacity:.3}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.28;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
.chip{position:absolute;min-width:72px;padding:6px 8px;background:rgba(12,16,24,.88);border:1px solid var(--line);border-radius:12px;text-align:center;backdrop-filter:blur(8px)}
.chip b{display:block;font-size:12px;font-weight:800}.chip s{display:block;text-decoration:none;color:var(--dim);font-size:9px;margin-top:1px}
.tl{left:0;top:28px}.tr{right:0;top:28px}.bl{left:0;bottom:22px}.br{right:0;bottom:22px}
.st{display:flex;justify-content:center;gap:6px;align-items:center;font-weight:700;margin:-4px 0 6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4154}.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 6px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.val{font-weight:800;font-size:13px}.lbl{color:var(--dim);font-size:9px;margin-top:2px}
.sw{width:42px;height:24px;border:0;border-radius:99px;background:#2a3142;position:relative;margin:0 auto}
.sw.on{background:var(--ok)}.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%}.sw.on i{left:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:68px;color:var(--txt)}
.card.on{border-color:var(--cy)}
.card h3{margin:0 0 3px;font-size:13px;color:#fff}.card p{margin:0;color:var(--dim);font-size:12px}
.box{padding:2px 12px 28px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.g{background:linear-gradient(90deg,#ff3b4a,#ff7a3a);color:#fff}.n{background:#1a1f2b;border:1px solid var(--line)}
.r{color:#ff6b76}
.hint{color:var(--dim);font-size:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px;max-width:90%;border:1px solid var(--line)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);background:#0e121a;border-radius:20px 20px 0 0;z-index:50;padding:10px 16px 28px;transition:.2s;max-height:88dvh;overflow:auto;border:1px solid var(--line)}.sh.show{transform:translate(-50%,0)}
.sh h3{margin:8px 0 4px}
.opt{display:block;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:0;text-align:left;color:var(--txt)}.opt.sel{color:var(--cy);font-weight:700}
input[type=range],input[type=number],input[type=color]{width:100%;background:transparent}
input[type=number]{background:#12151e;border:1px solid var(--line);border-radius:10px;padding:8px;color:#fff}
input[type=color]{height:40px;border:0;background:0;padding:0}
.spd{display:flex;gap:6px;margin:8px 0}
.spd button{flex:1;border:1px solid var(--line);background:#1a1f2b;border-radius:10px;padding:8px 0;font-size:12px}
.spd button.sel{border-color:var(--cy);color:var(--cy)}
.hide{display:none}
.chart-wrap{margin:4px 12px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px}
.chart-wrap .ch-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chart-wrap .ch-title span{font-size:12px;font-weight:700;color:var(--txt)}
.chart-wrap .leg{display:flex;gap:10px;font-size:10px;color:var(--dim)}
.chart-wrap .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chart-wrap canvas{width:100%;height:110px;display:block}
.swatch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.swatch button{width:28px;height:28px;border-radius:50%;border:2px solid #333;padding:0}
</style>
</head>
<body>
<div class="top"><button class="ib" id="back" type="button">‹</button><div><div class="brand">B3PRO LAB</div><h1>Điều khiển sò</h1></div><button class="ib" id="menu" type="button">⋮</button></div>
<div class="stage">
  <div class="chip tl"><b id="rpm">—</b><s>Tốc độ quạt</s></div>
  <div class="chip tr"><b id="watt">—</b><s>Công suất</s></div>
  <div class="chip bl"><b id="ntcHot">—</b><s>NTC mặt nóng</s></div>
  <div class="chip br"><b id="ntcCold">—</b><s>NTC mặt lạnh</s></div>
  <div class="ring"><i><img class="cool" alt="PIVA B3PRO" src="https://raw.githubusercontent.com/thaibao-byte/piva-b3pro-control/main/b3pro.png"/></i></div>
</div>
<div class="st"><span class="dot" id="dot"></span><span id="conn">Chưa kết nối</span></div>
<div class="metrics">
  <div class="m"><div class="val" id="run">00:00:00</div><div class="lbl">Thời gian chạy</div></div>
  <div class="m"><div class="val" id="pps">--</div><div class="lbl">Nguồn</div></div>
  <div class="m"><button class="sw" id="pwr" type="button"><i></i></button><div class="lbl" id="pwrTxt">Tắt</div><div class="lbl" id="timerLeft" style="color:var(--cy);min-height:12px"></div></div>
</div>
<div class="chart-wrap">
  <div class="ch-title"><span>Biểu đồ nhiệt độ</span><div class="leg"><span><i style="background:#ff3b4a"></i>Mặt nóng</span><span><i style="background:#2ee6ff"></i>Mặt lạnh</span></div></div>
  <canvas id="tChart" width="400" height="110"></canvas>
</div>
<div class="grid">
  <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
  <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Ánh sáng chảy</p></button>
  <button class="card" id="bRage" type="button"><h3>Cuồng nộ</h3><p id="rageTxt">Tắt</p></button>
  <button class="card" id="bSmart" type="button"><h3>Thông minh</h3><p id="smartTxt">Tắt</p></button>
  <button class="card" id="bProt" type="button"><h3>Cơ chế bảo vệ</h3><p id="protTxt">Nhiệt thấp ?</p></button>
  <button class="card" id="bFw" type="button"><h3>Phiên bản firmware</h3><p id="fwTxt">V212</p></button>
</div>
<div class="box"><div class="row"><button class="btn g" id="connect" type="button">Kết nối B3PRO</button><button class="btn n" id="dis" type="button">Ngắt</button></div></div>
<div class="bg" id="bg"></div><div class="sh" id="sh"><div id="body"></div></div><div class="toast" id="toast"></div>
<script>
(function(){
var SVC="49535343-fe7d-4ae5-8fa9-9fafd205e455",TX="49535343-8841-43f4-a8d4-ecbe34729bb3",RX="49535343-1e4d-4bd9-ba61-23c647249616";
var MODE=[{id:1,name:"Im lặng"},{id:2,name:"Cân bằng"},{id:3,name:"Cực lạnh"}];
var LIGHT=[{id:1,name:"Ánh sáng chảy",color:"multi",speed:1},{id:2,name:"Nhịp thở",color:"one",speed:1},{id:3,name:"Đuổi theo",color:"one",speed:1},{id:4,name:"Ánh sáng mềm",color:"one",speed:1},{id:5,name:"Sáng liên tục",color:"one",speed:0},{id:6,name:"Ánh sao",color:"multi",speed:1},{id:7,name:"Linh động",color:"multi",speed:1}];
var st={ok:false,dev:null,w:null,on:false,mode:3,fx:1,rage:0,pct:100,low:false,timer:null,timerEnd:0,fw:"V212",busy:false,holdUntil:0,runAcc:0,runAt:0,ntc:null,poll:null,pollTick:0,ledSpd:3,ledHex:"#8000FF",ledOn:true,probeMode:false,lastA8Fx:0,ledLock:false,modTimer:null,modName:"",_modBusy:false};
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2200)}
function sum8(a){var s=0;for(var i=0;i<a.length;i++)s=(s+a[i])&255;return s}
function frame(cmd,data){data=data||[];var p=[0x20,cmd,data.length].concat(data);p.push(sum8(p));return p}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function send(cmd,data){if(!st.w)throw new Error("Chưa kết nối");var p=new Uint8Array(frame(cmd,data));try{if(st.w.properties.writeWithoutResponse)await st.w.writeValueWithoutResponse(p);else await st.w.writeValue(p)}catch(e){try{await st.w.writeValue(p)}catch(e2){throw e2}}}
function modeName(id){var m=MODE.filter(function(x){return x.id===id})[0];return m?m.name:"Cân bằng"}
function lightOf(id){var L=LIGHT.filter(function(x){return x.id===id})[0];return L||{id:id,name:"Mode "+id,color:"one",speed:1}}
function lightName(id){return lightOf(id).name}
function rageLabel(){return st.rage===1?("Bật · "+st.pct+"%"):"Tắt"}
function pad(n){return (n<10?"0":"")+n}
function fmtRun(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;return pad(h)+":"+pad(m)+":"+pad(s)}
function runNow(){if(st.ok&&st.on&&st.runAt)return st.runAcc+(Date.now()-st.runAt);return st.runAcc}
function tickRun(){$("run").textContent=fmtRun(runNow());paintTimer()}
function paintTimer(){var el=$("timerLeft");if(!el)return;if(!st.timerEnd){el.textContent="";return}var left=Math.max(0,st.timerEnd-Date.now());if(left<=0){el.textContent="";st.timerEnd=0;return}var sec=Math.ceil(left/1000),m=Math.floor(sec/60);sec%=60;el.textContent="Tắt sau "+pad(m)+":"+pad(sec)}
function startRun(){if(!st.runAt)st.runAt=Date.now()}
function stopRun(){if(st.runAt){st.runAcc+=Date.now()-st.runAt;st.runAt=0}tickRun()}
function startPoll(){stopPoll();st.pollTick=0;st.poll=setInterval(async function(){if(!st.ok||!st.w||st.busy||st.ledLock||st.modName)return;if(Date.now()<st.holdUntil)return;st.busy=true;try{st.pollTick=(st.pollTick+1)&3;if(st.pollTick===0)await send(0x0C,[]);else await send(0x07,[])}catch(e){}finally{st.busy=false}},700)}
function stopPoll(){if(st.poll){clearInterval(st.poll);st.poll=null}}
function resetRun(){st.runAcc=0;st.runAt=0;tickRun()}
function parseTemps(data){var a=[],i,v;for(i=0;i<data.length;i++){if(i===0||i===3||i===4)continue;v=data[i];if(v>=0&&v<=95)a.push(v)}if(data.length>=3&&data[1]<=95&&data[2]<=95)return data[1]<=data[2]?{cold:data[1],hot:data[2]}:{cold:data[2],hot:data[1]};if(a.length>=2){a.sort(function(x,y){return x-y});return{cold:a[0],hot:a[a.length-1]}}if(a.length===1)return{cold:null,hot:a[0]};return{cold:null,hot:null}}
function hexRgb(h){h=(h||"#8000FF").replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function ledSp(){var sp=+st.ledSpd||3;if(sp<1)sp=1;if(sp>5)sp=5;return sp}
function stopLedMod(){if(st.modTimer){clearInterval(st.modTimer);st.modTimer=null}st.modName="";st._modBusy=false}
function hsv2rgb(h,s,v){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));v=Math.max(0,Math.min(1,v));var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
async function applyLed(){
  if(!st.ok){toast("Kết nối trước");return}
  if(st.ledLock)return;
  stopLedMod();
  st.ledLock=true;st.ledOn=true;paint();
  var L=lightOf(st.fx),sp=ledSp(),fx=st.fx|0;
  st.busy=true;st.holdUntil=Date.now()+4000;stopPoll();
  try{
    await send(0x06,[1]);await sleep(40);
    await send(0x07,[fx]);await sleep(60);
    if(L.speed){await send(0x07,[fx,sp]);await sleep(60)}
    var rgb=L.color==="multi"?[255,255,255]:hexRgb(st.ledHex);
    var r=rgb[0],g=rgb[1],b=rgb[2];
    await send(0x08,[1,fx,sp,sp,0,r,g,b,0,r,g,b,0,0]);await sleep(50);
    await send(0x08,[1,fx,sp,1,4,0,r,g,b,0,r,g,b,0]);await sleep(30);
    toast("Đèn: "+lightName(fx)+(L.speed?(" · nấc "+sp+"/5"):"")+(L.color==="one"?(" · "+st.ledHex):""));
  }catch(e){toast(e.message)}
  finally{st.busy=false;st.ledLock=false;st.holdUntil=Date.now()+1000;if(st.ok)startPoll()}
}
async function startLedMod(name){
  if(!st.ok){toast("Kết nối trước");return}
  stopLedMod();
  st.modName=name;st.ledOn=true;st.fx=5;st.ledLock=true;stopPoll();
  st.holdUntil=Date.now()+999999;
  try{
    await send(0x06,[1]);await sleep(40);
    await send(0x07,[5]);await sleep(60);
    await send(0x07,[5,3]);await sleep(40);
  }catch(e){toast(e.message);st.ledLock=false;st.modName="";if(st.ok)startPoll();return}
  var t0=Date.now();
  var period={police:280,strobe:160,rainbow:120,breath:100,fire:140,neon:120}[name]||120;
  st.modTimer=setInterval(async function(){
    if(!st.ok||!st.modName){stopLedMod();return}
    if(st._modBusy)return;st._modBusy=true;
    try{
      var elapsed=Date.now()-t0,r=0,g=0,b=0;
      if(name==="police"){var on=((elapsed/280)|0)%2===0;r=on?255:0;b=on?0:255}
      else if(name==="strobe"){var on2=((elapsed/160)|0)%2===0;r=g=b=on2?255:0}
      else if(name==="rainbow"){var rgb=hsv2rgb((elapsed/18)%360,1,1);r=rgb[0];g=rgb[1];b=rgb[2]}
      else if(name==="breath"){var ph=(Math.sin(elapsed/600)+1)/2;var base=hexRgb(st.ledHex);r=(base[0]*ph)|0;g=(base[1]*ph)|0;b=(base[2]*ph)|0}
      else if(name==="fire"){r=200+((Math.random()*55)|0);g=30+((Math.random()*100)|0);b=((Math.random()*25)|0)}
      else if(name==="neon"){var rgb2=hsv2rgb((elapsed/12)%360,0.9,1);r=rgb2[0];g=rgb2[1];b=rgb2[2]}
      await send(0x08,[1,5,3,3,0,r,g,b,0,r,g,b,0,0]);
      st.ledHex="#"+("0"+r.toString(16)).slice(-2)+("0"+g.toString(16)).slice(-2)+("0"+b.toString(16)).slice(-2);
      paintRing();
    }catch(e){}finally{st._modBusy=false}
  },period);
  toast("Mod: "+name);paint();
}
function setProtUi(){$("protTxt").textContent=st.low?"Nhiệt thấp bật":"Nhiệt thấp tắt";$("bProt").className="card"+(st.low?" on":"")}
function save(){try{localStorage.setItem("b3pro",JSON.stringify({mode:st.mode,fx:st.fx,pct:st.pct,low:st.low,ledSpd:st.ledSpd,ledHex:st.ledHex,ledOn:st.ledOn}))}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem("b3pro")||"null");if(!j)return;if(j.mode)st.mode=j.mode;if(j.fx)st.fx=j.fx;if(j.pct)st.pct=j.pct;if(j.low!=null)st.low=j.low;if(j.ledSpd)st.ledSpd=j.ledSpd;if(j.ledHex)st.ledHex=j.ledHex;if(j.ledOn!=null)st.ledOn=j.ledOn}catch(e){}}
function ringSpd(){return {1:"5.5s",2:"4.2s",3:"3.2s",4:"2.2s",5:"1.3s"}[ledSp()]||"3.2s"}
function paintRing(){var el=document.querySelector(".ring");if(!el)return;el.className="ring";if(!st.ledOn&&!st.modName){el.classList.add("fx-off");return}el.style.setProperty("--ring-spd",ringSpd());el.style.setProperty("--ring-col",st.ledHex||"#8000FF");var map={1:"fx-flow",2:"fx-breath",3:"fx-chase",4:"fx-soft",5:"fx-solid",6:"fx-star",7:"fx-flow"};el.classList.add(st.modName?"fx-solid":(map[st.fx]||"fx-flow"));if(!st.modName&&lightOf(st.fx).color==="multi")el.style.removeProperty("--ring-col")}
function paint(){if(st.rage===1){$("modeTxt").textContent="Khóa · Cuồng nộ";$("bMode").className="card";$("bMode").style.opacity=".45"}else if(st.rage===2){$("modeTxt").textContent="Khóa · Thông minh";$("bMode").className="card";$("bMode").style.opacity=".45"}else{$("modeTxt").textContent=modeName(st.mode);$("bMode").className="card on";$("bMode").style.opacity="1"}$("lightTxt").textContent=st.modName?("Mod: "+st.modName):(st.ledOn?lightName(st.fx):"Tắt");$("rageTxt").textContent=rageLabel();$("bRage").className="card"+(st.rage===1?" on":"");$("smartTxt").textContent=st.rage===2?"Bật":"Tắt";$("bSmart").className="card"+(st.rage===2?" on":"");setProtUi();paintRing()}
function parse(u){
  if(!u||u[0]!==0x20||u.length<4)return;
  var cmd=u[1],len=u[2],data=Array.from(u.slice(3,3+len));
  if(cmd===0xA5&&data.length>=7){
    var watt=data[0]|0,rpm=(data[3]|(data[4]<<8));
    $("rpm").textContent=rpm+" RPM";
    $("watt").textContent=watt+"W";
    if(watt>0)$("pps").textContent="PPS";else if(!st.on)$("pps").textContent="--";
    var tp=parseTemps(data);
    if(tp.hot!=null){$("ntcHot").textContent=tp.hot+"°C";st.ntc=tp.hot}
    if(tp.cold!=null)$("ntcCold").textContent=tp.cold+"°C";
    pushTemp(tp.hot,tp.cold);
    if(Date.now()>=st.holdUntil&&!st.modName){
      if(watt>0||rpm>50){if(!st.on){st.on=true;$("pwr").className="sw on";$("pwrTxt").textContent="Bật";startRun()}}
      else if(watt===0&&rpm===0){if(st.on){st.on=false;$("pwr").className="sw";$("pwrTxt").textContent="Tắt";stopRun()}}
    }
    return;
  }
  if(cmd===0xA6&&data.length>=4){
    st.on=!!data[0];
    var rg=data[1]|0;if(rg>2)rg=0;
    var md=data[2]|0,pct=data[3]|0;
    if(Date.now()>=st.holdUntil){st.rage=rg;if(rg===0&&md>=1&&md<=3)st.mode=md;if(rg===1&&pct>=80&&pct<=100)st.pct=pct}
    $("pwr").className="sw"+(st.on?" on":"");$("pwrTxt").textContent=st.on?"Bật":"Tắt";
    if(st.on)startRun();else stopRun();paint();save();return;
  }
  if(cmd===0xA7){if(data.length>=2)st.low=!!data[1];setProtUi();save();return}
  if(cmd===0xA8){
    if(Date.now()<st.holdUntil||st.modName)return;
    if(data.length>=1)st.ledOn=!!data[0];
    if(data.length>=2&&data[1]>=1&&data[1]<=7)st.fx=data[1];
    if(data.length>=3&&data[2]>=1&&data[2]<=5)st.ledSpd=data[2];
    if(data.length>=9){var r=data[6],g=data[7],b=data[8];if(r+g+b>0&&lightOf(st.fx).color==="one"){st.ledHex="#"+("0"+r.toString(16)).slice(-2)+("0"+g.toString(16)).slice(-2)+("0"+b.toString(16)).slice(-2);st.ledHex=st.ledHex.toUpperCase()}}
    paint();
  }
}
function openSh(html){$("body").innerHTML=html;$("bg").className="bg show";$("sh").className="sh show"}
function closeSh(){$("bg").className="bg";$("sh").className="sh"}
function renderLedMod(){
  openSh("<h3>LED Mod · Pháp sư</h3><p class='hint'>Web gửi màu liên tục (mode sáng cố định). Giữ tab mở.</p>"+
    (st.modName?("<p class='hint' style='color:var(--cy)'>Đang: <b>"+st.modName+"</b></p>":"")+
    "<button class='opt' data-mod='rainbow' type='button'>Rainbow</button>"+
    "<button class='opt' data-mod='police' type='button'>Police đỏ–xanh</button>"+
    "<button class='opt' data-mod='strobe' type='button'>Strobe</button>"+
    "<button class='opt' data-mod='breath' type='button'>Thở (màu đã chọn)</button>"+
    "<button class='opt' data-mod='fire' type='button'>Lửa</button>"+
    "<button class='opt' data-mod='neon' type='button'>Neon</button>"+
    "<div class='row' style='margin-top:10px'><button class='btn n' id='modStop' type='button'>Dừng</button><button class='btn g' id='modBack' type='button'>LED thường</button></div>");
  $("body").onclick=function(e){var m=e.target.closest("[data-mod]");if(m){startLedMod(m.getAttribute("data-mod"));renderLedMod()}};
  $("modStop").onclick=function(){stopLedMod();st.ledLock=false;st.holdUntil=Date.now()+400;if(st.ok)startPoll();toast("Đã dừng");renderLedMod()};
  $("modBack").onclick=function(){stopLedMod();st.ledLock=false;st.holdUntil=Date.now()+400;if(st.ok)startPoll();closeSh();renderLed()};
}
function renderLed(){
  var L=lightOf(st.fx);
  var spdHtml=L.speed?('<p class="hint">Tốc độ (5 nấc)</p><div class="spd">'+[1,2,3,4,5].map(function(n){return "<button type='button' data-sp='"+n+"' class='"+(ledSp()===n?"sel":"")+"'>"+n+"</button>"}).join("")+"</div>"):"";
  var sw=["#FF0000","#FF3B30","#FF7A00","#FFD600","#A8E10C","#22D37A","#00C853","#2EE6FF","#00B0FF","#3B82F6","#5856D6","#8000FF","#BF5AF2","#FF2D95","#FF2D55","#FFFFFF","#C0C0C0","#8B4513"];
  var colHtml=L.color==="one"?(
    '<p class="hint">Màu LED (chạm là gửi)</p>'+
    '<div class="row" style="align-items:center;gap:10px"><input id="ledc" type="color" value="'+st.ledHex+'" style="width:56px;height:40px"/><input id="ledhex" type="text" value="'+st.ledHex+'" maxlength="7" style="flex:1;background:#12151e;border:1px solid var(--line);border-radius:10px;padding:8px;color:#fff"/></div>'+
    '<div class="swatch">'+sw.map(function(c){return "<button type='button' data-c='"+c+"' style='background:"+c+";border-color:"+(String(st.ledHex).toUpperCase()===c?"#fff":"#333")+"'></button>"}).join("")+"</div>"
  ):'<p class="hint">Mode nhiều màu — sò tự rainbow</p>';
  openSh("<h3>Hiệu ứng ánh sáng</h3>"+LIGHT.map(function(m){return '<button class="opt'+(st.fx===m.id?" sel":"")+'" data-fx="'+m.id+'">'+m.name+(m.color==="one"?" · 1 màu":" · multi")+"</button>"}).join("")+colHtml+spdHtml+
    "<div class='row'><button class='btn g' id='ledGo' type='button'>Áp dụng</button><button class='btn n' id='ledOff' type='button'>Tắt đèn</button></div>"+
    "<div class='row'><button class='btn g' id='ledMod' type='button' style='width:100%'>LED Mod · Pháp sư</button></div>");
  function setColor(v){if(!v)return;v=String(v).trim();if(v[0]!=="#")v="#"+v;if(!/^#[0-9A-Fa-f]{6}$/.test(v)&&!/^#[0-9A-Fa-f]{3}$/.test(v))return;st.ledHex=v.length===4?("#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]).toUpperCase():v.toUpperCase();st.ledOn=true;save();paintRing();var c=$("ledc"),h=$("ledhex");if(c)c.value=st.ledHex;if(h)h.value=st.ledHex}
  function scheduleApply(){clearTimeout(st.ledDebounce);st.ledDebounce=setTimeout(function(){applyLed()},80)}
  $("body").onclick=function(e){
    var b=e.target.closest("[data-fx]");
    if(b){st.fx=+b.getAttribute("data-fx");st.ledOn=true;save();paint();renderLed();if(st.ok)scheduleApply();return}
    var sp=e.target.closest("[data-sp]");
    if(sp){st.ledSpd=+sp.getAttribute("data-sp");st.ledOn=true;save();paintRing();renderLed();if(st.ok)scheduleApply();return}
    var swb=e.target.closest("[data-c]");
    if(swb){setColor(swb.getAttribute("data-c"));if(st.ok)scheduleApply();return}
  };
  var c=$("ledc");if(c)c.oninput=function(){setColor(this.value);if(st.ok)scheduleApply()};
  var h=$("ledhex");if(h){h.onchange=function(){setColor(this.value);if(st.ok)scheduleApply()};h.onkeydown=function(ev){if(ev.key==="Enter"){setColor(this.value);if(st.ok)scheduleApply()}}}
  $("ledGo").onclick=applyLed;
  $("ledOff").onclick=async function(){stopLedMod();st.ledOn=false;paint();save();if(st.ok)try{st.busy=true;st.ledLock=true;stopPoll();await send(0x06,[0]);toast("Đã tắt đèn")}catch(e){toast(e.message)}finally{st.busy=false;st.ledLock=false;if(st.ok)startPoll()}};
  var lm=$("ledMod");if(lm)lm.onclick=function(){renderLedMod()};
}
async function attach(dev){
  st.dev=dev;var server=await dev.gatt.connect();var svc=await server.getPrimaryService(SVC);
  st.w=await svc.getCharacteristic(TX);var n=await svc.getCharacteristic(RX);
  await n.startNotifications();
  n.addEventListener("characteristicvaluechanged",function(ev){parse(new Uint8Array(ev.target.value.buffer))});
  dev.addEventListener("gattserverdisconnected",function(){stopLedMod();stopPoll();stopRun();st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Mất kết nối";toast("Mất kết nối")});
  st.ok=true;st.holdUntil=Date.now()+1200;st.on=false;$("pwr").className="sw";$("pwrTxt").textContent="…";
  $("dot").className="dot ok";$("conn").textContent="Đã kết nối";toast("Đã kết nối");
  resetRun();paint();startPoll();
  try{await send(0x07,[]);await sleep(40);await send(0x0C,[])}catch(e){}
}
async function ask(){if(!navigator.bluetooth){toast("Cần Chrome Android");return}try{await attach(await navigator.bluetooth.requestDevice({filters:[{name:"B3PRO"},{namePrefix:"B3PRO"}],optionalServices:[SVC,"generic_access","device_information"]}))}catch(e){toast(e.message||"Không kết nối được")}}
async function power(on){st.on=on;st.holdUntil=Date.now()+2000;$("pwr").className="sw"+(on?" on":"");$("pwrTxt").textContent=on?"Bật":"Tắt";if(on)startRun();else stopRun();if(st.ok)try{await send(0x0A,[on?1:0])}catch(e){toast(e.message)}}
function armTimer(min){if(st.timer)clearTimeout(st.timer);st.timer=null;st.timerEnd=0;paintTimer();if(!min){toast("Đã đóng hẹn giờ");return}st.timerEnd=Date.now()+min*60000;toast("Tắt sau "+min+" phút");st.timer=setTimeout(function(){st.timer=null;st.timerEnd=0;paintTimer();power(false);toast("Đã tắt theo lịch")},min*60000);paintTimer()}
var hist={hot:[],cold:[],max:90};
function pushTemp(h,c){if(h!=null)hist.hot.push(h);else hist.hot.push(hist.hot.length?hist.hot[hist.hot.length-1]:null);if(c!=null)hist.cold.push(c);else hist.cold.push(hist.cold.length?hist.cold[hist.cold.length-1]:null);if(hist.hot.length>hist.max){hist.hot.shift();hist.cold.shift()}drawChart()}
function drawChart(){
  var cv=$("tChart");if(!cv)return;
  var dpr=window.devicePixelRatio||1;var w=cv.clientWidth||360,h=110;
  if(cv.width!==Math.floor(w*dpr)||cv.height!==Math.floor(h*dpr)){cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr)}
  var ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  var padL=28,padR=8,padT=8,padB=16,iw=w-padL-padR,ih=h-padT-padB;
  var vals=hist.hot.concat(hist.cold).filter(function(v){return v!=null});
  var ymin=0,ymax=60;
  if(vals.length){ymin=Math.max(0,Math.min.apply(null,vals)-4);ymax=Math.min(100,Math.max.apply(null,vals)+4);if(ymax-ymin<12)ymax=ymin+12}
  function yx(v){return padT+ih*(1-(v-ymin)/(ymax-ymin||1))}
  function xx(i,n){return padL+(n<=1?iw/2:iw*i/(n-1))}
  ctx.strokeStyle="#1e2433";ctx.lineWidth=1;
  for(var g=0;g<4;g++){var gy=padT+ih*g/3;ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(padL+iw,gy);ctx.stroke();var tv=ymax-(ymax-ymin)*g/3;ctx.fillStyle="#8b93a7";ctx.font="9px sans-serif";ctx.textAlign="right";ctx.fillText(Math.round(tv)+"°",padL-4,gy+3)}
  function strokeSeries(arr,color){
    var n=arr.length;if(n<2)return;var pts=[];
    for(var i=0;i<n;i++){if(arr[i]!=null)pts.push({x:xx(i,n),y:yx(arr[i])})}
    if(pts.length<2)return;
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2.2;ctx.lineJoin="round";ctx.lineCap="round";
    ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length-1;i++){var xc=(pts[i].x+pts[i+1].x)/2,yc=(pts[i].y+pts[i+1].y)/2;ctx.quadraticCurveTo(pts[i].x,pts[i].y,xc,yc)}
    var last=pts[pts.length-1],prev=pts[pts.length-2];
    ctx.quadraticCurveTo(prev.x,prev.y,last.x,last.y);ctx.stroke();
    ctx.beginPath();ctx.fillStyle=color;ctx.arc(last.x,last.y,3.5,0,Math.PI*2);ctx.fill();
  }
  strokeSeries(hist.hot,"#ff3b4a");strokeSeries(hist.cold,"#2ee6ff");
  ctx.fillStyle="#8b93a7";ctx.font="9px sans-serif";ctx.textAlign="left";
  if(hist.hot.length){var lh=hist.hot[hist.hot.length-1],lc=hist.cold[hist.cold.length-1];ctx.fillText((lh!=null?lh+"°":"—")+" / "+(lc!=null?lc+"°":"—"),padL,h-4)}
}
load();paint();drawChart();setInterval(tickRun,1000);window.addEventListener("resize",function(){drawChart()});
$("connect").onclick=ask;
$("dis").onclick=function(){try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}stopLedMod();stopPoll();stopRun();st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Chưa kết nối"};
$("back").onclick=function(){if(st.ok)$("dis").click();else ask()};
$("bg").onclick=closeSh;
$("pwr").onclick=function(){if(!st.ok){toast("Kết nối trước");return}power(!st.on)};
$("bFw").onclick=function(){openSh("<h3>Firmware</h3><p>"+st.fw+" · YiChip</p><p class='hint'>Lab dò mode: dùng menu ⋮ nếu cần reset.</p>")};
$("menu").onclick=function(){
  openSh("<h3>Tùy chọn</h3><button class='opt r' id='mDis' type='button'>Ngắt kết nối</button><button class='opt' id='mReset' type='button'>Reset sò (khi lỗi)</button><button class='opt' id='mTimer' type='button'>Tắt nguồn theo lịch</button>");
  $("mDis").onclick=function(){closeSh();$("dis").click()};
  $("mReset").onclick=async function(){
    if(!st.ok){toast("Kết nối trước");return}
    closeSh();stopLedMod();st.busy=true;st.ledLock=true;stopPoll();st.holdUntil=Date.now()+5000;
    try{
      await send(0x0A,[0]);await sleep(250);
      await send(0x06,[0]);await sleep(150);
      await send(0x09,[0]);await sleep(150);
      await send(0x04,[st.mode>=1&&st.mode<=3?st.mode:3]);await sleep(120);
      await send(0x07,[1]);await sleep(80);
      await send(0x0C,[st.low?1:0]);
      st.rage=0;st.on=false;st.ledOn=false;paint();
      toast("Đã reset lệnh sò");
    }catch(e){toast(e.message)}
    finally{st.busy=false;st.ledLock=false;st.holdUntil=Date.now()+800;if(st.ok)startPoll()}
  };
  $("mTimer").onclick=function(){
    openSh("<h3>Tắt nguồn theo lịch</h3>"+[0,30,60,120,180].map(function(m){return "<button class='opt' data-m='"+m+"' type='button'>"+(m?("Sau "+m+" phút"):"Đóng")+"</button>"}).join("")+"<input id='cm' type='number' min='1' max='720' value='45'/><div class='row'><button class='btn g' id='cgo' type='button'>Đặt</button></div>");
    $("body").onclick=function(e){var b=e.target.closest("[data-m]");if(!b)return;armTimer(+b.getAttribute("data-m"));closeSh()};
    $("cgo").onclick=function(){armTimer(+$("cm").value||0);closeSh()};
  };
};
$("bMode").onclick=function(){if(!st.ok){toast("Kết nối trước");return}if(st.rage===1){toast("Tắt Cuồng nộ trước");return}if(st.rage===2){toast("Tắt Thông minh trước");return}openSh("<h3>Hiệu suất</h3>"+MODE.map(function(m){return '<button class="opt'+(st.mode===m.id?" sel":"")+'" data-id="'+m.id+'">'+m.name+'</button>'}).join(""));$("body").onclick=async function(e){var b=e.target.closest("[data-id]");if(!b)return;st.mode=+b.getAttribute("data-id");st.holdUntil=Date.now()+4000;paint();save();closeSh();if(st.ok)try{st.busy=true;await send(0x04,[st.mode]);toast(modeName(st.mode))}catch(err){toast(err.message)}finally{st.busy=false}}};
$("bLight").onclick=renderLed;
$("bRage").onclick=function(){
  openSh("<h3>Cuồng nộ</h3><button class='opt"+(st.rage===1?" sel":"")+"' id='rOn'>Bật</button><button class='opt"+(st.rage!==1?" sel":"")+"' id='rOff'>Tắt</button><div id='fanBox' class='"+(st.rage===1?"":" hide")+"'><p class='hint' id='pctLbl'>Quạt "+st.pct+"%</p><input id='rng' type='range' min='80' max='100' value='"+Math.max(80,st.pct)+"'/><div class='row'><button class='btn g' id='apply'>Gửi %</button></div></div>");
  async function setRage(on){if(!st.ok){toast("Kết nối trước");return}st.busy=true;st.holdUntil=Date.now()+6000;try{if(on){if(st.rage===2){await send(0x09,[0]);await sleep(120)}st.rage=1;paint();await send(0x09,[1]);await sleep(120);var p=Math.max(80,Math.min(100,st.pct|0));st.pct=p;await send(0x05,[p]);await sleep(80);await send(0x09,[1])}else{st.rage=0;paint();await send(0x09,[0]);await sleep(120);await send(0x04,[st.mode>=1&&st.mode<=3?st.mode:3])}save();toast(on?"Cuồng nộ ON":"Cuồng nộ OFF")}catch(e){toast(e.message)}finally{st.busy=false}}
  $("rOn").onclick=function(){setRage(true)};$("rOff").onclick=function(){setRage(false)};
  var rng=$("rng");if(rng)rng.oninput=function(){$("pctLbl").textContent="Quạt "+this.value+"%";st.pct=+this.value};
  $("apply").onclick=async function(){if(!st.ok||st.rage!==1){toast("Bật Cuồng nộ trước");return}st.pct=Math.max(80,Math.min(100,+$("rng").value||100));paint();save();st.busy=true;st.holdUntil=Date.now()+4000;try{await send(0x09,[1]);await sleep(60);await send(0x05,[st.pct]);toast("Quạt "+st.pct+"%")}catch(e){toast(e.message)}finally{st.busy=false}};
};
$("bSmart").onclick=async function(){if(!st.ok){toast("Kết nối trước");return}var on=st.rage!==2;st.busy=true;st.holdUntil=Date.now()+6000;try{if(on){if(st.rage===1){await send(0x09,[0]);await sleep(120)}st.rage=2;paint();await send(0x09,[2]);await sleep(120);await send(0x09,[2])}else{st.rage=0;paint();await send(0x09,[0]);await sleep(120);await send(0x04,[st.mode>=1&&st.mode<=3?st.mode:3])}save();toast(on?"Thông minh ON":"Thông minh OFF")}catch(e){toast(e.message)}finally{st.busy=false}};
$("bProt").onclick=function(){openSh("<h3>Bảo vệ</h3><button class='opt' id='lon'>Bật nhiệt thấp</button><button class='opt' id='loff'>Tắt nhiệt thấp</button>");$("lon").onclick=async function(){if(st.ok)try{await send(0x0C,[1])}catch(e){toast(e.message)}};$("loff").onclick=async function(){if(st.ok)try{await send(0x0C,[0])}catch(e){toast(e.message)}}};
})();
