<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>PIVA B3PRO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;touch-action:manipulation}
button,input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.top h1{margin:0;font-size:18px}
.ib{width:40px;height:40px;border:0;background:0;font-size:22px}
.hero{text-align:center;padding:6px 16px}
.logo{width:150px;height:150px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800;background:conic-gradient(#ff4d4d,#ffd166,#22c55e,#38bdf8,#a78bfa,#ff4d4d)}
.st{display:flex;justify-content:center;gap:6px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:#e5e7eb;color:#fff;display:grid;place-items:center;font-size:10px}
.dot.ok{background:#22c55e}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:8px}
.val{font-weight:800;font-size:16px}
.lbl{color:#6b7280;font-size:11px}
.sw{width:42px;height:24px;border:0;border-radius:99px;background:#e5e7eb;position:relative;margin:8px auto}
.sw.on{background:#22c55e}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%}
.sw.on i{left:20px}
.box{padding:0 12px 28px}
.warn{background:#ecfdf5;color:#065f46;border-radius:12px;padding:10px;font-size:12px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:700;font-size:13px}
.g{background:#22c55e;color:#fff}
.n{background:#f3f4f6}
.k{background:#111;color:#fff}
.btn:disabled{opacity:.45}
.log{background:#0b1220;color:#bbf7d0;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}
h2{font-size:14px;margin:16px 0 8px}
.hint{color:#6b7280;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card{background:#f3f4f6;border-radius:14px;padding:12px;text-align:left;border:0}
</style>
</head>
<body>
<div class="top"><button class="ib" id="back" type="button">‹</button><h1>B3PRO</h1><span></span></div>
<div class="hero">
  <div class="logo">A</div>
  <div class="st"><span class="dot" id="dot">✓</span><span id="conn">Chưa kết nối</span></div>
</div>
<div class="metrics">
  <div><div class="val" id="rpm">—</div><div class="lbl">RPM</div></div>
  <div><div class="val" id="aux">—</div><div class="lbl">Byte trạng thái</div></div>
  <div><div class="val" id="ack">—</div><div class="lbl">Phản hồi</div></div>
</div>
<button class="sw on" id="pwr" type="button"><i></i></button>
<div class="box">
  <div class="warn">Đã bắt được giao thức: ghi <b>8841</b>, nhận <b>1E4D</b>, khung <b>20 + lệnh + dài + data + tổng</b>. Máy tự gửi RPM mỗi giây.</div>
  <div class="row">
    <button class="btn g" id="connect" type="button">Kết nối B3PRO</button>
    <button class="btn n" id="scan" type="button">Quét tất cả</button>
    <button class="btn n" id="dis" type="button">Ngắt</button>
  </div>
  <div class="grid">
    <button class="card" id="m0" type="button">Cực lạnh</button>
    <button class="card" id="m1" type="button">Tiết kiệm</button>
    <button class="card" id="m2" type="button">Im lặng</button>
    <button class="card" id="m3" type="button">Kiểm soát nhiệt</button>
  </div>
  <div class="row">
    <button class="btn k" id="probe" type="button">Dò lệnh 20-xx</button>
    <button class="btn n" id="copy" type="button">Chép nhật ký</button>
  </div>
  <div class="hint" id="info">Chưa chọn thiết bị.</div>
  <h2>Nhật ký</h2>
  <div class="log" id="log"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var SVC="49535343-fe7d-4ae5-8fa9-9fafd205e455";
var TX="49535343-8841-43f4-a8d4-ecbe34729bb3";
var RX="49535343-1e4d-4bd9-ba61-23c647249616";
var OPT=[SVC,"generic_access","device_information"];
var st={ok:false,dev:null,w:null,busy:false,on:true};
function $(id){return document.getElementById(id)}
function log(m){var el=$("log");el.textContent+="["+new Date().toLocaleTimeString("vi-VN")+"] "+m+"\n";el.scrollTop=el.scrollHeight}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},1800)}
function hex(u){return Array.from(u).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(" ").toUpperCase()}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function sum8(a){var x=0;for(var i=0;i<a.length;i++)x=(x+a[i])&255;return x}
function frame(cmd, data){
  data=data||[];
  var p=[0x20,cmd,data.length].concat(data);
  p.push(sum8(p));
  return p;
}
function parse20(u){
  if(!u||u[0]!==0x20||u.length<4)return null;
  var cmd=u[1],len=u[2];
  if(u.length<3+len+1)return {cmd:cmd,len:len,raw:u,bad:true};
  var data=Array.from(u.slice(3,3+len));
  var cs=u[3+len], ok=sum8(u.slice(0,3+len))===cs;
  return {cmd:cmd,len:len,data:data,cs:cs,ok:ok,raw:u};
}
function onNotify(ev){
  var u=new Uint8Array(ev.target.value.buffer);
  var f=parse20(u);
  if(!f){log("Nhận lạ "+hex(u));return}
  if(f.cmd===0xA5&&f.data&&f.data.length>=7){
    var rpm=f.data[3]|(f.data[4]<<8);
    var aux=f.data[5];
    $("rpm").textContent=rpm;
    $("aux").textContent=aux;
    log("Trạng thái RPM "+rpm+" · aux "+aux+" · "+hex(u));
  }else if(f.cmd===0x51){
    $("ack").textContent="51/"+hex(f.data||[]);
    log("ACK "+hex(u));
  }else log("Gói cmd="+f.cmd.toString(16)+" "+hex(u));
}
async function writeFrame(cmd,data){
  if(!st.w)throw new Error("Chưa kết nối");
  var p=frame(cmd,data);
  log("Gửi "+hex(p));
  await st.w.writeValueWithoutResponse(new Uint8Array(p));
}
async function attach(dev){
  st.dev=dev;
  $("info").textContent="Thiết bị: "+(dev.name||"(không tên)");
  log("Chọn "+(dev.name||dev.id));
  var server=await dev.gatt.connect();
  var svc=await server.getPrimaryService(SVC);
  st.w=await svc.getCharacteristic(TX);
  var n=await svc.getCharacteristic(RX);
  await n.startNotifications();
  n.addEventListener("characteristicvaluechanged",onNotify);
  st.ok=true;$("dot").className="dot ok";$("conn").textContent="Đã kết nối";
  log("TX 8841 / RX 1E4D");
  toast("Đã kết nối");
}
async function ask(all){
  if(!navigator.bluetooth){toast("Cần Chrome Android");return}
  try{
    var opt=all?{acceptAllDevices:true,optionalServices:OPT}:{filters:[{namePrefix:"B3"},{namePrefix:"PIVA"},{namePrefix:"B3PRO"},{services:[SVC]}],optionalServices:OPT};
    await attach(await navigator.bluetooth.requestDevice(opt));
  }catch(e){log("Lỗi: "+(e.message||e.name||"không rõ"))}
}
async function probe(){
  if(!st.ok){toast("Kết nối trước");return}
  if(st.busy)return;
  st.busy=true;$("probe").disabled=true;
  log("Dò lệnh khung 20 xx");
  var cmds=[0x01,0x02,0x03,0x04,0x05,0x06,0x07,0x08,0x09,0x0A,0x10,0xA5,0x51];
  for(var i=0;i<cmds.length;i++){
    try{
      await writeFrame(cmds[i],[]);
      await sleep(350);
      await writeFrame(cmds[i],[0]);
      await sleep(350);
      await writeFrame(cmds[i],[1]);
      await sleep(350);
    }catch(e){log("Lỗi dò: "+e.message)}
  }
  st.busy=false;$("probe").disabled=false;toast("Xong dò lệnh");
}
$("connect").onclick=function(){ask(false)};
$("scan").onclick=function(){ask(true)};
$("dis").onclick=function(){try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Chưa kết nối"};
$("back").onclick=function(){if(st.ok)$("dis").click();else $("connect").click()};
$("probe").onclick=probe;
$("copy").onclick=function(){navigator.clipboard&&navigator.clipboard.writeText($("log").textContent).then(function(){toast("Đã chép")})};
$("pwr").onclick=async function(){
  st.on=!st.on;
  $("pwr").className="sw"+(st.on?" on":"");
  if(!st.ok)return;
  try{await writeFrame(0x02,[st.on?1:0])}catch(e){log(e.message)}
};
function mode(id){
  return async function(){
    if(!st.ok){toast("Kết nối trước");return}
    try{await writeFrame(0x03,[id]);toast("Gửi chế độ "+id)}catch(e){log(e.message)}
  };
}
$("m0").onclick=mode(0);
$("m1").onclick=mode(1);
$("m2").onclick=mode(2);
$("m3").onclick=mode(3);
log("Sẵn sàng. Kết nối sẽ hiện RPM nếu máy gửi gói 20 A5.");
})();
</script>
</body>
</html>
