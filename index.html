<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#05070e"/>
<title>B3PRO · 8D Lab</title>
<style>
:root{
  --bg:#05070e;--card:rgba(18,22,34,.72);--line:rgba(80,120,180,.18);
  --txt:#eef3ff;--dim:#8b95ad;--cy:#2ee6ff;--mag:#b44dff;--or:#ff6a3d;--ok:#22d37a;
  --glow:0 0 40px rgba(46,230,255,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{
  max-width:430px;margin:0 auto;min-height:100dvh;overflow-x:hidden;
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%,rgba(60,40,120,.55),transparent 55%),
    radial-gradient(ellipse 70% 40% at 100% 30%,rgba(46,230,255,.08),transparent 50%),
    radial-gradient(ellipse 60% 35% at 0% 70%,rgba(180,77,255,.1),transparent 50%),
    var(--bg);
  perspective:1200px;
}
.orbs{pointer-events:none;position:fixed;inset:0;max-width:430px;left:50%;transform:translateX(-50%);z-index:0;overflow:hidden}
.orbs span{position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;animation:orb 12s ease-in-out infinite}
.orbs span:nth-child(1){width:180px;height:180px;background:#2ee6ff;top:8%;left:-40px;animation-delay:0s}
.orbs span:nth-child(2){width:140px;height:140px;background:#b44dff;top:40%;right:-30px;animation-delay:-4s}
.orbs span:nth-child(3){width:120px;height:120px;background:#ff6a3d;bottom:15%;left:20%;animation-delay:-7s}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-25px) scale(1.15)}}
.wrap{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.brand{font-size:9px;letter-spacing:.28em;color:var(--cy);font-weight:800;text-shadow:0 0 12px rgba(46,230,255,.5)}
.top h1{margin:2px 0 0;font-size:16px;font-weight:800;background:linear-gradient(90deg,#fff,#2ee6ff 60%,#b44dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:20px;color:var(--txt);backdrop-filter:blur(12px)}
.stage{
  position:relative;width:300px;height:290px;margin:4px auto 8px;
  transform-style:preserve-3d;
  animation:floatY 5s ease-in-out infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ring{
  position:absolute;left:42px;top:22px;width:216px;height:216px;
  transform-style:preserve-3d;
}
.ring::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#ff3b4a,#ffb000,#2ee6ff,#7a5cff,#ff3b4a);
  box-shadow:0 0 30px rgba(46,230,255,.25),0 0 60px rgba(180,77,255,.12),inset 0 0 20px rgba(0,0,0,.4);
  filter:saturate(1.2);
}
.ring::after{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(46,230,255,.15);
  box-shadow:0 0 20px rgba(46,230,255,.08);
  animation:pulseRing 3s ease-in-out infinite;
}
@keyframes pulseRing{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.03)}}
.ring i{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#1a2030,#07090f 70%);padding:10px;display:block;
  box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 8px 32px rgba(0,0,0,.45)}
.cool{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
.ring.fx-flow::before,.ring.fx-star::before,.ring.fx-chase::before{animation:spin var(--ring-spd,3s) linear infinite}
.ring.fx-breath::before,.ring.fx-soft::before{
  animation:breath var(--ring-spd,2.6s) ease-in-out infinite;
  background:var(--ring-col,#8000FF)!important;
  box-shadow:0 0 36px var(--ring-col,#8000FF),0 0 70px rgba(180,77,255,.2)}
.ring.fx-solid::before{animation:none;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 28px var(--ring-col,#8000FF)}
.ring.fx-off::before{animation:none!important;background:#1a1e2a!important;box-shadow:none;opacity:.25}
.ring.fx-off::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1.02)}}
.chip{
  position:absolute;min-width:78px;padding:8px 10px;
  background:rgba(10,14,22,.75);border:1px solid var(--line);border-radius:14px;
  text-align:center;backdrop-filter:blur(16px);box-shadow:var(--glow);
  transform:translateZ(40px);
}
.chip b{display:block;font-size:13px;font-weight:800;letter-spacing:.02em}
.chip s{display:block;text-decoration:none;color:var(--dim);font-size:9px;margin-top:2px;letter-spacing:.04em}
.tl{left:0;top:32px}.tr{right:0;top:32px}.bl{left:0;bottom:28px}.br{right:0;bottom:28px}
.chip.tl b{color:#2ee6ff}.chip.tr b{color:#ffb000}.chip.bl b{color:#ff5a6a}.chip.br b{color:#7ad7ff}
.st{display:flex;justify-content:center;gap:8px;align-items:center;font-weight:700;margin:0 0 4px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4154}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.fwline{font-size:10px;color:var(--dim);text-align:center;padding:2px 12px 8px;letter-spacing:.06em}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 14px 8px}
.m{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;
  backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.25);
}
.val{font-weight:800;font-size:14px}.lbl{color:var(--dim);font-size:9px;margin-top:3px;letter-spacing:.03em}
.sw{width:46px;height:26px;border:0;border-radius:99px;background:#252a3a;position:relative;margin:0 auto;box-shadow:inset 0 1px 4px rgba(0,0,0,.4)}
.sw.on{background:linear-gradient(90deg,#1ad68a,#22d37a);box-shadow:0 0 14px rgba(34,211,122,.4)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on i{left:23px}
.chart-wrap{
  margin:4px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;
  backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.chart-wrap .ch-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700}
.chart-wrap .leg{display:flex;gap:12px;font-size:10px;color:var(--dim)}
.chart-wrap .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.chart-wrap canvas{width:100%;height:120px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 8px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;min-height:74px;color:var(--txt);
  backdrop-filter:blur(20px);box-shadow:0 6px 28px rgba(0,0,0,.28);
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.card:active{transform:scale(.97)}
.card.on{border-color:rgba(46,230,255,.45);box-shadow:0 0 24px rgba(46,230,255,.12),0 6px 28px rgba(0,0,0,.28)}
.card h3{margin:0 0 4px;font-size:13px;color:#fff;font-weight:700}
.card p{margin:0;color:var(--dim);font-size:12px}
.box{padding:4px 14px 32px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:13px}
.g{background:linear-gradient(135deg,#ff3b4a,#ff7a3a 50%,#ffb000);color:#fff;box-shadow:0 6px 24px rgba(255,80,50,.35)}
.n{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.r{color:#ff6b76}
.hint{color:var(--dim);font-size:12px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(12,16,28,.92);color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:80;font-size:13px;max-width:90%;border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;backdrop-filter:blur(6px)}.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);background:rgba(10,14,22,.94);border-radius:24px 24px 0 0;z-index:50;padding:12px 18px 32px;transition:.28s cubic-bezier(.2,.8,.2,1);max-height:88dvh;overflow:auto;border:1px solid var(--line);backdrop-filter:blur(24px);box-shadow:0 -12px 48px rgba(0,0,0,.5)}.sh.show{transform:translate(-50%,0)}
.sh h3{margin:10px 0 6px;font-size:16px}
.opt{display:block;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:0;text-align:left;color:var(--txt);font-size:14px}.opt.sel{color:var(--cy);font-weight:700}
input[type=range]{width:100%;accent-color:var(--cy)}
.hide{display:none!important}
.step{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
.step button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:20px;font-weight:800}
.step .num{min-width:76px;text-align:center;font-size:24px;font-weight:800}
.tog{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.pickers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;height:160px}
.pick-col{position:relative;background:rgba(18,22,34,.9);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pick-col::before,.pick-col::after{content:"";position:absolute;left:0;right:0;height:48px;z-index:2;pointer-events:none}
.pick-col::before{top:0;background:linear-gradient(rgba(10,14,22,.95),transparent)}
.pick-col::after{bottom:0;background:linear-gradient(transparent,rgba(10,14,22,.95))}
.pick-col .mid{position:absolute;left:6px;right:6px;top:56px;height:40px;border-top:1px solid var(--cy);border-bottom:1px solid var(--cy);border-radius:8px;pointer-events:none;z-index:1;opacity:.4}
.pick-col .lab{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);z-index:3}
.pick-scroll{height:160px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;padding:56px 0;scrollbar-width:none}
.pick-scroll::-webkit-scrollbar{display:none}
.pick-scroll div{height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;scroll-snap-align:center;color:var(--dim)}
.pick-scroll div.on{color:#fff;font-size:24px;text-shadow:0 0 12px rgba(46,230,255,.4)}
.badge8d{display:inline-block;font-size:8px;letter-spacing:.12em;padding:2px 6px;border-radius:6px;background:linear-gradient(90deg,rgba(46,230,255,.2),rgba(180,77,255,.25));color:var(--cy);margin-left:6px;vertical-align:middle;font-weight:800}
</style>
</head>
<body>
<div class="orbs"><span></span><span></span><span></span></div>
<div class="wrap">
<div class="top">
  <button class="ib" id="back" type="button">‹</button>
  <div style="text-align:center"><div class="brand">B3PRO LAB <span class="badge8d">8D</span></div><h1>Điều khiển sò</h1></div>
  <button class="ib" id="menu" type="button">⋮</button>
</div>
<div class="stage">
  <div class="chip tl"><b id="rpm">—</b><s>Tốc độ quạt</s></div>
  <div class="chip tr"><b id="watt">—</b><s>Công suất</s></div>
  <div class="chip bl"><b id="ntcHot">—</b><s>NTC mặt nóng</s></div>
  <div class="chip br"><b id="ntcCold">—</b><s>NTC mặt lạnh</s></div>
  <div class="ring"><i><img class="cool" alt="B3PRO" src="https://raw.githubusercontent.com/thaibao-byte/piva-b3pro-control/main/b3pro.png"/></i></div>
</div>
<div class="st"><span class="dot" id="dot"></span><span id="conn">Chưa kết nối</span></div>
<div class="fwline" id="fwLine">Firmware: —</div>
<div class="metrics">
  <div class="m"><div class="val" id="run">00:00:00</div><div class="lbl">Thời gian chạy</div></div>
  <div class="m"><div class="val" id="pps">--</div><div class="lbl">Nguồn</div></div>
  <div class="m"><button class="sw" id="pwr" type="button"><i></i></button><div class="lbl" id="pwrTxt">Tắt</div><div class="lbl" id="timerLeft" style="color:var(--cy);min-height:12px"></div></div>
</div>
<div class="chart-wrap">
  <div class="ch-title"><span>Biểu đồ nhiệt độ</span><div class="leg"><span><i style="background:#ff3b4a;color:#ff3b4a"></i>Nóng</span><span><i style="background:#2ee6ff;color:#2ee6ff"></i>Lạnh</span></div></div>
  <canvas id="tChart" width="400" height="120"></canvas>
</div>
<div class="grid">
  <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
  <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Ánh sáng chảy</p></button>
  <button class="card" id="bRage" type="button"><h3>Cuồng nộ</h3><p id="rageTxt">Tắt</p></button>
  <button class="card" id="bSmart" type="button"><h3>Thông minh</h3><p id="smartTxt">Tắt</p></button>
  <button class="card" id="bProt" type="button"><h3>Cơ chế bảo vệ</h3><p id="protTxt">Nhiệt thấp ?</p></button>
  <button class="card" id="bTimer" type="button"><h3>Hẹn giờ tắt</h3><p id="timerTxt">Tắt</p></button>
</div>
<div class="box" id="connBox">
  <div class="row"><button class="btn g" id="connect" type="button">Kết nối B3PRO</button></div>
</div>
</div>
<div class="bg" id="bg"></div>
<div class="sh" id="sh"><div id="body"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=48"></script>
</body>
</html>
