<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#05070e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>B3PRO · 8D Lab</title>
<style>
:root{
  --bg:#05070e;--card:rgba(16,20,32,.78);--line:rgba(100,140,200,.16);
  --txt:#eef3ff;--dim:#8b95ad;--cy:#2ee6ff;--mag:#b44dff;--ok:#22d37a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
body{
  max-width:430px;margin:0 auto;min-height:100dvh;overflow-x:hidden;
  background:
    radial-gradient(ellipse 100% 55% at 50% -12%,rgba(70,45,140,.5),transparent 55%),
    radial-gradient(ellipse 55% 35% at 100% 25%,rgba(46,230,255,.07),transparent 55%),
    radial-gradient(ellipse 50% 30% at 0% 75%,rgba(180,77,255,.08),transparent 50%),
    var(--bg);
}
.orbs{pointer-events:none;position:fixed;inset:0;max-width:430px;left:50%;transform:translateX(-50%);z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(56px);opacity:.4;animation:orb 14s ease-in-out infinite}
.orbs i:nth-child(1){width:200px;height:200px;background:#2ee6ff;top:5%;left:-50px}
.orbs i:nth-child(2){width:160px;height:160px;background:#b44dff;top:38%;right:-40px;animation-delay:-5s}
.orbs i:nth-child(3){width:130px;height:130px;background:#ff6a3d;bottom:12%;left:18%;animation-delay:-9s}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(16px,-20px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.orbs i,.stage,.ring::before,.ring::after{animation:none!important}}
.wrap{position:relative;z-index:1;padding-bottom:28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.brand{font-size:9px;letter-spacing:.26em;color:var(--cy);font-weight:800;text-shadow:0 0 14px rgba(46,230,255,.45)}
.badge{display:inline-block;font-size:8px;letter-spacing:.14em;padding:2px 7px;border-radius:6px;
  background:linear-gradient(90deg,rgba(46,230,255,.22),rgba(180,77,255,.28));color:var(--cy);margin-left:6px;font-weight:800;vertical-align:middle}
.top h1{margin:3px 0 0;font-size:17px;font-weight:800;
  background:linear-gradient(105deg,#fff 20%,#2ee6ff 55%,#c070ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);font-size:20px;color:var(--txt);backdrop-filter:blur(12px);cursor:pointer}
.stage{position:relative;width:300px;height:292px;margin:2px auto 6px;animation:floatY 5.5s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ring{position:absolute;left:42px;top:24px;width:216px;height:216px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#ff3b4a,#ffb000,#2ee6ff,#7a5cff,#ff3b4a);
  box-shadow:0 0 32px rgba(46,230,255,.28),0 0 64px rgba(180,77,255,.14),inset 0 0 24px rgba(0,0,0,.45);
  filter:saturate(1.15)}
.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(46,230,255,.14);box-shadow:0 0 24px rgba(46,230,255,.06);
  animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.85;transform:scale(1.025)}}
.ring i{position:absolute;inset:11px;border-radius:50%;display:block;padding:10px;
  background:radial-gradient(circle at 38% 28%,#1c2438,#06080f 72%);
  box-shadow:inset 0 0 28px rgba(0,0,0,.65),0 10px 36px rgba(0,0,0,.5)}
.cool{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(0,0,0,.55))}
.ring.fx-flow::before,.ring.fx-star::before,.ring.fx-chase::before{animation:spin var(--ring-spd,3s) linear infinite}
.ring.fx-breath::before,.ring.fx-soft::before{
  animation:breath var(--ring-spd,2.6s) ease-in-out infinite;
  background:var(--ring-col,#8000FF)!important;
  box-shadow:0 0 40px var(--ring-col,#8000FF),0 0 72px rgba(180,77,255,.22)}
.ring.fx-solid::before{animation:none;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 30px var(--ring-col,#8000FF)}
.ring.fx-off::before{animation:none!important;background:#1a1e2a!important;box-shadow:none;opacity:.22}
.ring.fx-off::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.32;transform:scale(.96)}50%{opacity:1;transform:scale(1.02)}}
.chip{position:absolute;min-width:80px;padding:8px 10px;text-align:center;
  background:rgba(8,12,20,.78);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(18px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.chip b{display:block;font-size:13px;font-weight:800}
.chip s{display:block;text-decoration:none;color:var(--dim);font-size:9px;margin-top:2px;letter-spacing:.03em}
.tl{left:0;top:34px}.tr{right:0;top:34px}.bl{left:0;bottom:30px}.br{right:0;bottom:30px}
.chip.tl b{color:#2ee6ff}.chip.tr b{color:#ffb000}.chip.bl b{color:#ff5a6a}.chip.br b{color:#7ad7ff}
.st{display:flex;justify-content:center;gap:8px;align-items:center;font-weight:700;margin:0 0 2px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4154}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.fwline{font-size:10px;color:var(--dim);text-align:center;padding:2px 12px 10px;letter-spacing:.05em}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 8px}
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 6px;text-align:center;
  backdrop-filter:blur(20px);box-shadow:0 4px 20px rgba(0,0,0,.22)}
.val{font-weight:800;font-size:14px}.lbl{color:var(--dim);font-size:9px;margin-top:3px}
.sw{width:48px;height:28px;border:0;border-radius:99px;background:#252a3a;position:relative;margin:0 auto;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.45);cursor:pointer}
.sw.on{background:linear-gradient(90deg,#1ad68a,#22d37a);box-shadow:0 0 16px rgba(34,211,122,.4)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}.sw.on i{left:23px}
.chart-wrap{margin:4px 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;
  backdrop-filter:blur(20px);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.chart-wrap .ch-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700}
.chart-wrap .leg{display:flex;gap:12px;font-size:10px;color:var(--dim)}
.chart-wrap .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.chart-wrap canvas{width:100%;height:120px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 13px;text-align:left;min-height:76px;color:var(--txt);
  backdrop-filter:blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.26);cursor:pointer;
  transition:transform .12s,border-color .15s,box-shadow .15s}
.card:active{transform:scale(.975)}
.card.on{border-color:rgba(46,230,255,.5);box-shadow:0 0 28px rgba(46,230,255,.12),0 6px 24px rgba(0,0,0,.26)}
.card h3{margin:0 0 5px;font-size:13px;color:#fff;font-weight:700}
.card p{margin:0;color:var(--dim);font-size:12px}
.box{padding:6px 16px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14px;cursor:pointer}
.g{background:linear-gradient(135deg,#ff3b4a,#ff7a3a 55%,#ffb000);color:#fff;box-shadow:0 8px 28px rgba(255,80,50,.35);width:100%}
.n{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt)}
.r{color:#ff6b76}
.hint{color:var(--dim);font-size:12px;line-height:1.5;margin:10px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(10,14,24,.94);color:#fff;
  padding:12px 18px;border-radius:14px;display:none;z-index:90;font-size:13px;max-width:88%;
  border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 10px 36px rgba(0,0,0,.45)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:40;backdrop-filter:blur(8px)}.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);
  background:rgba(8,12,20,.96);border-radius:24px 24px 0 0;z-index:50;padding:14px 18px 36px;
  transition:.28s cubic-bezier(.22,.8,.22,1);max-height:88dvh;overflow:auto;
  border:1px solid var(--line);backdrop-filter:blur(28px);box-shadow:0 -16px 48px rgba(0,0,0,.55)}
.sh.show{transform:translate(-50%,0)}
.sh h3{margin:8px 0 8px;font-size:17px;font-weight:800}
.opt{display:block;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:0;text-align:left;color:var(--txt);font-size:14px;cursor:pointer}
.opt.sel{color:var(--cy);font-weight:700}
input[type=range]{width:100%;accent-color:var(--cy);margin:8px 0}
.hide{display:none!important}
.step{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.step button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:22px;font-weight:800;color:var(--txt);cursor:pointer}
.step .num{min-width:80px;text-align:center;font-size:26px;font-weight:800}
.tog{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.pickers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;height:168px}
.pick-col{position:relative;background:rgba(16,20,32,.95);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pick-col::before,.pick-col::after{content:"";position:absolute;left:0;right:0;height:52px;z-index:2;pointer-events:none}
.pick-col::before{top:0;background:linear-gradient(rgba(8,12,20,.98),transparent)}
.pick-col::after{bottom:0;background:linear-gradient(transparent,rgba(8,12,20,.98))}
.pick-col .mid{position:absolute;left:6px;right:6px;top:60px;height:40px;border-top:1px solid var(--cy);border-bottom:1px solid var(--cy);border-radius:8px;pointer-events:none;z-index:1;opacity:.4}
.pick-col .lab{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);z-index:3;letter-spacing:.06em}
.pick-scroll{height:168px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;padding:60px 0;scrollbar-width:none}
.pick-scroll::-webkit-scrollbar{display:none}
.pick-scroll div{height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;scroll-snap-align:center;color:var(--dim)}
.pick-scroll div.on{color:#fff;font-size:24px;text-shadow:0 0 14px rgba(46,230,255,.45)}
.foot{text-align:center;font-size:9px;color:var(--dim);padding:16px 12px 8px;letter-spacing:.08em;opacity:.7}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="top">
    <button class="ib" id="back" type="button" aria-label="Back">‹</button>
    <div style="text-align:center">
      <div class="brand">B3PRO LAB <span class="badge">8D</span></div>
      <h1>Điều khiển sò</h1>
    </div>
    <button class="ib" id="menu" type="button" aria-label="Menu">⋮</button>
  </div>
  <div class="stage">
    <div class="chip tl"><b id="rpm">—</b><s>Tốc độ quạt</s></div>
    <div class="chip tr"><b id="watt">—</b><s>Công suất</s></div>
    <div class="chip bl"><b id="ntcHot">—</b><s>NTC mặt nóng</s></div>
    <div class="chip br"><b id="ntcCold">—</b><s>NTC mặt lạnh</s></div>
    <div class="ring"><i><img class="cool" alt="B3PRO" src="https://raw.githubusercontent.com/thaibao-byte/piva-b3pro-control/main/b3pro.png" width="180" height="180"/></i></div>
  </div>
  <div class="st"><span class="dot" id="dot"></span><span id="conn">Chưa kết nối</span></div>
  <div class="fwline" id="fwLine">Firmware: — · YiChip</div>
  <div class="metrics">
    <div class="m"><div class="val" id="run">00:00:00</div><div class="lbl">Thời gian chạy</div></div>
    <div class="m"><div class="val" id="pps">--</div><div class="lbl">Nguồn</div></div>
    <div class="m">
      <button class="sw" id="pwr" type="button" aria-label="Nguồn"><i></i></button>
      <div class="lbl" id="pwrTxt">Tắt</div>
      <div class="lbl" id="timerLeft" style="color:var(--cy);min-height:12px"></div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="ch-title">
      <span>Biểu đồ nhiệt độ</span>
      <div class="leg">
        <span><i style="background:#ff3b4a;color:#ff3b4a"></i>Nóng</span>
        <span><i style="background:#2ee6ff;color:#2ee6ff"></i>Lạnh</span>
      </div>
    </div>
    <canvas id="tChart" width="400" height="120"></canvas>
  </div>
  <div class="grid">
    <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
    <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Ánh sáng chảy</p></button>
    <button class="card" id="bRage" type="button"><h3>Cuồng nộ</h3><p id="rageTxt">Tắt</p></button>
    <button class="card" id="bSmart" type="button"><h3>Thông minh</h3><p id="smartTxt">Tắt</p></button>
    <button class="card" id="bProt" type="button"><h3>Cơ chế bảo vệ</h3><p id="protTxt">Nhiệt thấp ?</p></button>
    <button class="card" id="bTimer" type="button"><h3>Hẹn giờ tắt</h3><p id="timerTxt">Tắt</p></button>
  </div>
  <div class="box" id="connBox">
    <div class="row"><button class="btn g" id="connect" type="button">Kết nối B3PRO</button></div>
  </div>
  <div class="foot">PIVA B3PRO · WEB 8D · V49</div>
</div>
<div class="bg" id="bg"></div>
<div class="sh" id="sh"><div id="body"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=49"></script>
</body>
</html>
