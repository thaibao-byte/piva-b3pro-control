<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<title>PIVA B3PRO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;touch-action:manipulation}
button,input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;background:#fff;z-index:5}
.top h1{margin:0;font-size:18px}
.ib{width:40px;height:40px;border:0;background:0;font-size:22px}
.hero{text-align:center;padding:8px 16px}
.logo{width:160px;height:160px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800;background:conic-gradient(#ff4d4d,#ffd166,#22c55e,#38bdf8,#a78bfa,#ff4d4d)}
.st{display:flex;justify-content:center;gap:6px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:#e5e7eb;color:#fff;display:grid;place-items:center;font-size:10px}
.dot.ok{background:#22c55e}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:8px}
.val{font-weight:800;font-size:13px}
.lbl{color:#6b7280;font-size:11px}
.sw{width:42px;height:24px;border:0;border-radius:99px;background:#e5e7eb;position:relative;margin:0 auto 6px}
.sw.on{background:#22c55e}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%}
.sw.on i{left:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.card{background:#f3f4f6;border:1.5px solid transparent;border-radius:18px;padding:14px;min-height:88px;text-align:left}
.card.active{background:#f0fdf4;border-color:#22c55e}
.card h3{margin:8px 0 2px;font-size:15px}
.card p{margin:0;color:#6b7280;font-size:13px}
.box{padding:0 12px 28px}
.warn{background:#fff7ed;color:#9a3412;border-radius:12px;padding:10px;font-size:12px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:700;font-size:13px}
.g{background:#22c55e;color:#fff}
.n{background:#f3f4f6}
.k{background:#111;color:#fff}
.btn:disabled{opacity:.45}
.log{background:#0b1220;color:#bbf7d0;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all}
input{width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:11px}
h2{font-size:14px;margin:16px 0 8px}
.hint{color:#6b7280;font-size:12px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px}
</style>
</head>
<body>
<div class="top"><button class="ib" id="back" type="button">‹</button><h1>B3PRO</h1><button class="ib" id="menu" type="button">☰</button></div>
<div class="hero"><div class="logo">A</div><div class="st"><span class="dot" id="dot">✓</span><span id="conn">Chưa kết nối</span></div></div>
<div class="metrics">
  <div><div class="val" id="rpm">— RPM</div><div class="lbl">Tốc độ quạt</div></div>
  <div><div class="val" id="pps">—</div><div class="lbl">Nguồn</div></div>
  <div><div class="val" id="watt">—</div><div class="lbl">Công suất</div></div>
  <div><button class="sw on" id="pwr" type="button"><i></i></button><div class="val" id="pwrTxt">Bật</div></div>
</div>
<div class="grid">
  <button class="card active" id="cMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
  <button class="card" id="cLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Linh động</p></button>
  <button class="card" id="cRage" type="button"><h3>Chế độ ép xung</h3><p id="rageTxt">Đóng</p></button>
  <button class="card" id="cSmart" type="button"><h3>Điều khiển thông minh</h3><p id="smartTxt">Đóng</p></button>
</div>
<div class="box">
  <div class="warn">Web tự dò: kết nối rồi bấm <b>Tự dò giao thức</b>. Trang gửi lần lượt gói thử và ghi gói máy trả về. Dùng Chrome Android, tắt app Piva trước.</div>
  <h2>Kết nối</h2>
  <div class="row">
    <button class="btn g" id="connect" type="button">Kết nối B3PRO</button>
    <button class="btn n" id="scan" type="button">Quét tất cả</button>
    <button class="btn n" id="dis" type="button">Ngắt</button>
  </div>
  <div class="row">
    <button class="btn k" id="probe" type="button">Tự dò giao thức</button>
    <button class="btn n" id="stop" type="button">Dừng dò</button>
    <button class="btn n" id="copy" type="button">Chép nhật ký</button>
  </div>
  <div class="hint" id="info">Chưa chọn thiết bị.</div>
  <h2>Nhật ký dò</h2>
  <div class="log" id="log"></div>
  <input id="hex" placeholder="Gửi HEX tay, ví dụ AA 55 01 00"/>
  <div class="row"><button class="btn k" id="send" type="button">Gửi mã</button><button class="btn n" id="clr" type="button">Xóa nhật ký</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var ISSC={s:"49535343-fe7d-4ae5-8fa9-9fafd205e455",w:"49535343-8841-43f4-a8d4-ecbe34729bb3",n:"49535343-1e4d-4bd9-ba61-23c647249616"};
var OPT=[ISSC.s,"6e400001-b5a3-f393-e0a9-e50e24dcca9e","0000ffe0-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb","generic_access","device_information"];
var st={ok:false,dev:null,w:null,n:null,busy:false,stop:false,lastRx:0,hits:[]};
function $(id){return document.getElementById(id)}
function log(m){var el=$("log");el.textContent+="["+new Date().toLocaleTimeString("vi-VN")+"] "+m+"\n";el.scrollTop=el.scrollHeight}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2000)}
function hex(u){return Array.from(u).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(" ").toUpperCase()}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function xor(body){var x=0;for(var i=0;i<body.length;i++)x^=body[i];return x}
function sum(body){var x=0;for(var i=0;i<body.length;i++)x=(x+body[i])&255;return x}
function frameA55A(cmd,pl){pl=pl||[];var body=[cmd].concat(pl);var pkt=[0xA5,0x5A,body.length].concat(body);pkt.push(xor(pkt.slice(2)));return pkt}
function frameAA55(cmd,pl){pl=pl||[];var body=[cmd].concat(pl);var pkt=[0xAA,0x55,body.length].concat(body);pkt.push(sum(pkt.slice(2)));return pkt}
function guessStatus(bytes){
  if(!bytes||!bytes.length)return;
  for(var i=0;i<bytes.length-1;i++){
    var le=bytes[i]|(bytes[i+1]<<8);
    if(le>=800&&le<=9000){$("rpm").textContent=le+" RPM";break}
  }
  for(var j=0;j<bytes.length;j++){
    if(bytes[j]>=6&&bytes[j]<=40){$("watt").textContent=bytes[j]+"W";break}
  }
  if(bytes.length===22)log("Gói 22 byte (đúng kiểu app gốc)");
}
async function writeBytes(arr){
  if(!st.w)throw new Error("Chưa có kênh ghi");
  var u=arr instanceof Uint8Array?arr:new Uint8Array(arr);
  var p=st.w.properties||{};
  if(p.writeWithoutResponse&&st.w.writeValueWithoutResponse)await st.w.writeValueWithoutResponse(u);
  else await st.w.writeValue(u);
}
function onNotify(ev){
  var u=new Uint8Array(ev.target.value.buffer);
  st.lastRx=Date.now();
  st.hits.push(hex(u));
  log("Nhận "+hex(u));
  guessStatus(u);
}
function propsOf(c){var p=c.properties||{},o=[];for(var k in p)if(p[k])o.push(k);return o.join(",")}
async function attach(dev){
  st.dev=dev;
  $("info").textContent="Thiết bị: "+(dev.name||"(không tên)");
  log("Chọn "+(dev.name||dev.id));
  var server=await dev.gatt.connect();
  log("Đã vào GATT");
  var services=[];
  try{services.push(await server.getPrimaryService(ISSC.s))}catch(e){}
  if(!services.length)services=await server.getPrimaryServices();
  log("Dịch vụ: "+services.map(function(s){return s.uuid}).join(", "));
  st.w=null;st.n=null;
  for(var i=0;i<services.length;i++){
    var chars=await services[i].getCharacteristics();
    log("  "+services[i].uuid+" → "+chars.map(function(c){return c.uuid.slice(0,8)+"["+propsOf(c)+"]"}).join(" | "));
    for(var k=0;k<chars.length;k++){
      var c=chars[k],p=c.properties||{};
      if(!st.w&&(c.uuid===ISSC.w||p.write||p.writeWithoutResponse))st.w=c;
      if(!st.n&&(c.uuid===ISSC.n||p.notify||p.indicate))st.n=c;
    }
  }
  if(!st.w)throw new Error("Không có kênh ghi");
  log("Kênh ghi "+st.w.uuid);
  if(st.n){
    await st.n.startNotifications();
    st.n.addEventListener("characteristicvaluechanged",onNotify);
    log("Đã bật nhận "+st.n.uuid);
  }else log("Không có kênh nhận — dò sẽ kém");
  st.ok=true;$("dot").className="dot ok";$("conn").textContent="Đã kết nối";$("pps").textContent="PPS";
  toast("Đã kết nối");
}
async function ask(all){
  if(!navigator.bluetooth){toast("Cần Chrome Android + HTTPS");return}
  try{
    var opt=all?{acceptAllDevices:true,optionalServices:OPT}:{filters:[{namePrefix:"B3"},{namePrefix:"PIVA"},{namePrefix:"B3PRO"},{services:[ISSC.s]}],optionalServices:OPT};
    var dev=await navigator.bluetooth.requestDevice(opt);
    await attach(dev);
  }catch(e){log("Lỗi: "+e.message);if(e.name==="NotFoundError")toast("Không thấy máy — bấm Quét tất cả")}
}
function probes(){
  var list=[],i;
  list.push({ten:"raw hỏi 01",b:[0x01]});
  list.push({ten:"raw hỏi 00",b:[0x00]});
  list.push({ten:"raw nguồn bật",b:[0x02,0x01]});
  list.push({ten:"raw nguồn tắt",b:[0x02,0x00]});
  for(i=1;i<=8;i++)list.push({ten:"A55A cmd "+i,b:frameA55A(i,[0])});
  for(i=1;i<=8;i++)list.push({ten:"AA55 cmd "+i,b:frameAA55(i,[0])});
  list.push({ten:"A55A hỏi trạng thái",b:frameA55A(0x01,[0x00])});
  list.push({ten:"AA55 hỏi trạng thái",b:frameAA55(0x01,[0x00])});
  list.push({ten:"22 byte không",b:new Array(22).fill(0)});
  list.push({ten:"FE FE hỏi",b:[0xFE,0xFE]});
  list.push({ten:"55 AA",b:[0x55,0xAA,0x01,0x00,0x56]});
  return list;
}
async function runProbe(){
  if(!st.ok){toast("Kết nối máy trước");return}
  if(st.busy)return;
  st.busy=true;st.stop=false;st.hits=[];
  $("probe").disabled=true;
  var list=probes();
  log("Bắt đầu tự dò "+list.length+" gói. Quan sát quạt/đèn.");
  for(var i=0;i<list.length;i++){
    if(st.stop){log("Đã dừng dò");break}
    var item=list[i];
    var before=st.lastRx;
    try{
      log("Thử "+(i+1)+"/"+list.length+" · "+item.ten+" · "+hex(item.b));
      await writeBytes(item.b);
      await sleep(280);
      if(st.lastRx>before)log("→ Có phản hồi");
    }catch(e){log("Lỗi gói: "+e.message);await sleep(200)}
  }
  log("Xong dò. Số lần nhận: "+st.hits.length);
  if(st.hits.length)log("Mẫu nhận: "+st.hits.slice(0,5).join(" || "));
  else log("Máy im. Thử Quét tất cả hoặc gửi HEX tay.");
  st.busy=false;$("probe").disabled=false;toast("Xong dò");
}
$("connect").onclick=function(){ask(false)};
$("scan").onclick=function(){ask(true)};
$("dis").onclick=function(){st.stop=true;try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Chưa kết nối";toast("Đã ngắt")};
$("back").onclick=function(){if(st.ok)$("dis").click();else $("connect").click()};
$("probe").onclick=runProbe;
$("stop").onclick=function(){st.stop=true};
$("copy").onclick=function(){
  var t=$("log").textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Đã chép nhật ký")}).catch(function(){toast("Chép tay trong ô nhật ký")});
  else toast("Giữ nhật ký rồi chép");
};
$("send").onclick=function(){
  var s=$("hex").value.replace(/[^0-9a-fA-F]/g,"");
  if(!s||s.length%2){toast("HEX không hợp lệ");return}
  var u=new Uint8Array(s.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(s.substr(i*2,2),16);
  writeBytes(u).then(function(){log("Gửi tay "+hex(u))}).catch(function(e){toast(e.message)});
};
$("clr").onclick=function(){$("log").textContent=""};
$("pwr").onclick=function(){
  var on=!$("pwr").classList.contains("on");
  $("pwr").className="sw"+(on?" on":"");
  $("pwrTxt").textContent=on?"Bật":"Tắt";
  if(st.ok)writeBytes([2,on?1:0]).catch(function(){});
};
$("cMode").onclick=function(){toast("Kết nối rồi bấm Tự dò giao thức")};
$("cLight").onclick=function(){toast("Kết nối rồi bấm Tự dò giao thức")};
$("cRage").onclick=function(){toast("Kết nối rồi bấm Tự dò giao thức")};
$("cSmart").onclick=function(){toast("Kết nối rồi bấm Tự dò giao thức")};
$("menu").onclick=function(){toast("UUID ISSC lấy từ APK Piva 1.7.3")};
log("Sẵn sàng tự dò. Chrome Android, tắt app Piva, kết nối rồi bấm Tự dò giao thức.");
})();
</script>
</body>
</html>
