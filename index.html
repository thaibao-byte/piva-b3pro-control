<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#f2f4f7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>B3PRO · 8D Lab</title>
<style>
:root{
  --bg:#eef1f6;--card:#ffffff;--line:rgba(0,0,0,.06);
  --txt:#1a1d26;--dim:#8a91a0;--cy:#00b8d9;--ok:#12c26a;--accent:#ff5a3c;
  --shadow:0 8px 28px rgba(30,40,60,.08);--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
body{
  max-width:430px;margin:0 auto;min-height:100dvh;overflow-x:hidden;
  background:linear-gradient(180deg,#f7f9fc 0%,#e8ecf3 45%,#eef1f6 100%);
}
.wrap{position:relative;z-index:1;padding-bottom:28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.brand{font-size:9px;letter-spacing:.22em;color:var(--cy);font-weight:800}
.badge{display:inline-block;font-size:8px;letter-spacing:.12em;padding:2px 7px;border-radius:6px;
  background:linear-gradient(90deg,#00b8d9,#5b8def);color:#fff;margin-left:6px;font-weight:800;vertical-align:middle}
.top h1{margin:3px 0 0;font-size:17px;font-weight:800;color:#12151c}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:#fff;font-size:20px;color:var(--txt);box-shadow:var(--shadow);cursor:pointer}
.stage{position:relative;width:300px;height:300px;margin:4px auto 8px}
.ring{position:absolute;left:42px;top:28px;width:216px;height:216px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#ff5a3c,#ffb020,#00d4ff,#7a5cff,#ff5a3c);
  box-shadow:0 0 24px rgba(0,184,217,.2);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(0,184,217,.12)}
.core{position:absolute;inset:14px;border-radius:50%;display:block;padding:6px;
  background:#fff;box-shadow:0 12px 40px rgba(30,40,60,.12),inset 0 0 0 1px rgba(0,0,0,.04);overflow:hidden}
.cool-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;border-radius:50%;overflow:hidden}
.cool,.cool-vid{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.cool{object-fit:contain}
.cool.custom{object-fit:cover}
.cool-vid{position:absolute;inset:0;object-fit:cover;background:#0a0c10}
.media-btn{
  position:absolute;z-index:5;width:32px;height:32px;border-radius:50%;
  border:0;background:rgba(255,255,255,.92);color:#1a1d26;
  font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(30,40,60,.18);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .25s,transform .2s,background .2s;
}
.media-btn:active{transform:scale(.92)}
#btnMedia{right:8px;bottom:8px;font-size:18px;line-height:1}
#btnMediaReset{left:8px;bottom:8px;font-size:15px;background:rgba(26,29,38,.88);color:#fff}
#btnMediaReset.hide{opacity:0;pointer-events:none;transform:scale(.8)}
.cool-wrap.has-custom #btnMedia{opacity:.85}
.ring.fx-flow::before,.ring.fx-star::before,.ring.fx-chase::before{animation:spin var(--ring-spd,3s) linear infinite}
.ring.fx-breath::before,.ring.fx-soft::before{
  animation:breath var(--ring-spd,2.6s) ease-in-out infinite;
  background:var(--ring-col,#8000FF)!important}
.ring.fx-solid::before{animation:none;background:var(--ring-col,#8000FF)!important}
.ring.fx-off::before{animation:none!important;background:#c8cdd6!important;opacity:.4}
.ring.fx-off::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.4}50%{opacity:1}}
.chip{position:absolute;min-width:82px;padding:9px 11px;text-align:center;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.chip b{display:block;font-size:13px;font-weight:800}
.chip s{display:block;text-decoration:none;color:var(--dim);font-size:9px;margin-top:2px}
.tl{left:0;top:36px}.tr{right:0;top:36px}.bl{left:0;bottom:28px}.br{right:0;bottom:28px}
.chip.tl b{color:#00a8c8}.chip.tr b{color:#e89a00}.chip.bl b{color:#e84545}.chip.br b{color:#2a9fd8}
.st{display:flex;justify-content:center;gap:8px;align-items:center;font-weight:700;margin:0 0 2px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#c5cad3}
.dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(18,194,106,.5)}
.fwline{font-size:10px;color:var(--dim);text-align:center;padding:2px 12px 10px;letter-spacing:.04em}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 16px 10px}
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.val{font-weight:800;font-size:14px;color:#12151c}.lbl{color:var(--dim);font-size:9px;margin-top:4px}
.sw{width:48px;height:28px;border:0;border-radius:99px;background:#d8dce6;position:relative;margin:0 auto;cursor:pointer}
.sw.on{background:linear-gradient(90deg,#12c26a,#1ad67a);box-shadow:0 0 12px rgba(18,194,106,.35)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}.sw.on i{left:23px}
.chart-wrap{margin:4px 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 12px 12px;box-shadow:var(--shadow)}
.chart-wrap .ch-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:700;color:#12151c}
.chart-wrap .leg{display:flex;gap:12px;font-size:10px;color:var(--dim)}
.chart-wrap .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chart-wrap canvas{width:100%;height:120px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 14px;text-align:left;min-height:78px;color:var(--txt);
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .15s}
.card:active{transform:scale(.975)}
.card.on{border-color:rgba(0,184,217,.45);box-shadow:0 0 0 1px rgba(0,184,217,.2),var(--shadow)}
.card h3{margin:0 0 5px;font-size:13px;color:#12151c;font-weight:700}
.card p{margin:0;color:var(--dim);font-size:12px}
.box{padding:8px 16px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:14px;cursor:pointer}
.g{background:linear-gradient(135deg,#ff5a3c,#ff8a4a);color:#fff;box-shadow:0 8px 24px rgba(255,90,60,.3);width:100%}
.n{background:#fff;border:1px solid var(--line);color:var(--txt);box-shadow:var(--shadow)}
.r{color:#e84545}.hint{color:var(--dim);font-size:12px;line-height:1.5;margin:10px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a1d26;color:#fff;padding:12px 18px;border-radius:14px;display:none;z-index:90;font-size:13px;max-width:88%;box-shadow:0 10px 32px rgba(0,0,0,.25)}
.bg{position:fixed;inset:0;background:rgba(20,24,32,.35);display:none;z-index:40;backdrop-filter:blur(6px)}.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);background:#fff;border-radius:24px 24px 0 0;z-index:50;padding:14px 18px 36px;transition:.28s cubic-bezier(.22,.8,.22,1);max-height:88dvh;overflow:auto;box-shadow:0 -12px 40px rgba(0,0,0,.12)}
.sh.show{transform:translate(-50%,0)}.sh h3{margin:8px 0 8px;font-size:17px;font-weight:800;color:#12151c}
.opt{display:block;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:0;text-align:left;color:var(--txt);font-size:14px;cursor:pointer}.opt.sel{color:var(--cy);font-weight:700}
input[type=range]{width:100%;accent-color:var(--cy);margin:8px 0}.hide{display:none!important}
.step{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.step button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#f5f7fa;font-size:22px;font-weight:800;color:var(--txt);cursor:pointer}
.step .num{min-width:80px;text-align:center;font-size:26px;font-weight:800}
.tog{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.pickers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;height:168px}
.pick-col{position:relative;background:#f5f7fa;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pick-col::before,.pick-col::after{content:"";position:absolute;left:0;right:0;height:52px;z-index:2;pointer-events:none}
.pick-col::before{top:0;background:linear-gradient(#f5f7fa,transparent)}
.pick-col::after{bottom:0;background:linear-gradient(transparent,#f5f7fa)}
.pick-col .mid{position:absolute;left:6px;right:6px;top:60px;height:40px;border-top:1px solid var(--cy);border-bottom:1px solid var(--cy);border-radius:8px;pointer-events:none;z-index:1;opacity:.5}
.pick-col .lab{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);z-index:3}
.pick-scroll{height:168px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;padding:60px 0;scrollbar-width:none}
.pick-scroll::-webkit-scrollbar{display:none}
.pick-scroll div{height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;scroll-snap-align:center;color:var(--dim)}
.pick-scroll div.on{color:#12151c;font-size:24px}
.foot{text-align:center;font-size:9px;color:var(--dim);padding:16px 12px 8px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="ib" id="back" type="button" aria-label="Back">‹</button>
    <div style="text-align:center">
      <div class="brand">B3PRO LAB <span class="badge">8D</span></div>
      <h1>Điều khiển sò</h1>
    </div>
    <button class="ib" id="menu" type="button" aria-label="Menu">⋮</button>
  </div>
  <div class="stage">
    <div class="chip tl"><b id="rpm">—</b><s>Tốc độ quạt</s></div>
    <div class="chip tr"><b id="watt">—</b><s>Công suất</s></div>
    <div class="chip bl"><b id="ntcHot">—</b><s>NTC mặt nóng</s></div>
    <div class="chip br"><b id="ntcCold">—</b><s>NTC mặt lạnh</s></div>
    <div class="ring" id="ledRing">
      <i class="core">
        <div class="cool-wrap" id="coolWrap">
          <img class="cool" id="coolImg" alt="B3PRO" src="https://raw.githubusercontent.com/thaibao-byte/piva-b3pro-control/main/b3pro.png" width="180" height="180"/>
          <video class="cool-vid hide" id="coolVid" playsinline loop></video>
          <button type="button" class="media-btn" id="btnMedia" title="Đổi ảnh/video">＋</button>
          <button type="button" class="media-btn reset hide" id="btnMediaReset" title="Ảnh gốc">↺</button>
          <input type="file" id="mediaInput" class="hide" accept="image/*,video/*,.heic,.heif"/>
        </div>
      </i>
    </div>
  </div>
  <div class="st"><span class="dot" id="dot"></span><span id="conn">Chưa kết nối</span></div>
  <div class="fwline" id="fwLine">Firmware: — · YiChip</div>
  <div class="metrics">
    <div class="m"><div class="val" id="run">00:00:00</div><div class="lbl">Thời gian chạy</div></div>
    <div class="m"><div class="val" id="pps">--</div><div class="lbl">Nguồn</div></div>
    <div class="m">
      <button class="sw" id="pwr" type="button" aria-label="Nguồn"><i></i></button>
      <div class="lbl" id="pwrTxt">Tắt</div>
      <div class="lbl" id="timerLeft" style="color:var(--cy);min-height:12px"></div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="ch-title">
      <span>Biểu đồ nhiệt độ</span>
      <div class="leg">
        <span><i style="background:#e84545"></i>Nóng</span>
        <span><i style="background:#00b8d9"></i>Lạnh</span>
      </div>
    </div>
    <canvas id="tChart" width="400" height="120"></canvas>
  </div>
  <div class="grid">
    <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
    <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Ánh sáng chảy</p></button>
    <button class="card" id="bRage" type="button"><h3>Cuồng nộ</h3><p id="rageTxt">Tắt</p></button>
    <button class="card" id="bSmart" type="button"><h3>Thông minh</h3><p id="smartTxt">Tắt</p></button>
    <button class="card" id="bProt" type="button"><h3>Cơ chế bảo vệ</h3><p id="protTxt">Nhiệt thấp ?</p></button>
    <button class="card" id="bTimer" type="button"><h3>Hẹn giờ tắt</h3><p id="timerTxt">Tắt</p></button>
  </div>
  <div class="box" id="connBox">
    <div class="row"><button class="btn g" id="connect" type="button">Kết nối B3PRO</button></div>
  </div>
  <div class="foot">PIVA B3PRO · WEB 8D · V57</div>
</div>
<div class="bg" id="bg"></div>
<div class="sh" id="sh"><div id="body"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=57"></script>
</body>
</html>
