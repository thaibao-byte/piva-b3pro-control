<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>B3PRO Lab</title>
<style>
:root{--bg:#07090f;--card:#12151e;--line:#1e2433;--txt:#e8edf7;--dim:#8b93a7;--cy:#2ee6ff;--rd:#ff3b4a;--ok:#22d37a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;background:radial-gradient(120% 55% at 50% -8%,#1a2744 0%,var(--bg) 52%)}
button,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.brand{font-size:10px;letter-spacing:.18em;color:var(--cy);font-weight:800}
.top h1{margin:0;font-size:15px;font-weight:800}
.ib{width:36px;height:36px;border:0;background:0;font-size:22px;color:var(--txt)}
.stage{position:relative;width:280px;height:268px;margin:0 auto}
.ring{position:absolute;left:36px;top:18px;width:208px;height:208px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff3b4a,#ffb000,#2ee6ff,#7a5cff,#ff3b4a);animation:spin 4.5s linear infinite;box-shadow:0 0 28px rgba(46,230,255,.22)}
.ring i{position:absolute;inset:7px;border-radius:50%;background:#0b0d14;padding:8px;display:block}
.cool{width:100%;height:100%;object-fit:contain}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{position:absolute;min-width:72px;padding:6px 8px;background:rgba(12,16,24,.88);border:1px solid var(--line);border-radius:12px;text-align:center;backdrop-filter:blur(8px)}
.chip b{display:block;font-size:12px;font-weight:800}.chip s{display:block;text-decoration:none;color:var(--dim);font-size:9px;margin-top:1px}
.tl{left:0;top:28px}.tr{right:0;top:28px}.bl{left:0;bottom:22px}.br{right:0;bottom:22px}
.st{display:flex;justify-content:center;gap:6px;align-items:center;font-weight:700;margin:-4px 0 6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4154}.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 6px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.val{font-weight:800;font-size:13px}.lbl{color:var(--dim);font-size:9px;margin-top:2px}
.sw{width:42px;height:24px;border:0;border-radius:99px;background:#2a3142;position:relative;margin:0 auto}
.sw.on{background:var(--ok)}.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%}.sw.on i{left:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:68px;color:var(--txt)}
.card.on{border-color:var(--cy)}
.card h3{margin:0 0 3px;font-size:13px;color:#fff}.card p{margin:0;color:var(--dim);font-size:12px}
.box{padding:2px 12px 28px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.g{background:linear-gradient(90deg,#ff3b4a,#ff7a3a);color:#fff}.n{background:#1a1f2b;border:1px solid var(--line)}
.r{color:#ff6b76}
.hint{color:var(--dim);font-size:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px;max-width:90%;border:1px solid var(--line)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);background:#0e121a;border-radius:20px 20px 0 0;z-index:50;padding:10px 16px 28px;transition:.2s;max-height:88dvh;overflow:auto;border:1px solid var(--line)}.sh.show{transform:translate(-50%,0)}
.sh h3{margin:8px 0 4px}
.opt{display:block;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:0;text-align:left;color:var(--txt)}.opt.sel{color:var(--cy);font-weight:700}
input[type=range],input[type=number],input[type=color]{width:100%;background:transparent}
input[type=number]{background:#12151e;border:1px solid var(--line);border-radius:10px;padding:8px;color:#fff}
input[type=color]{height:40px;border:0;background:0;padding:0}
.spd{display:flex;gap:6px;margin:8px 0}
.spd button{flex:1;border:1px solid var(--line);background:#1a1f2b;border-radius:10px;padding:8px 0;font-size:12px}
.spd button.sel{border-color:var(--cy);color:var(--cy)}
.hide{display:none}
</style>
</head>
<body>
<div class="top"><button class="ib" id="back" type="button">‹</button><div><div class="brand">B3PRO LAB</div><h1>Điều khiển sò</h1></div><button class="ib" id="menu" type="button">⋮</button></div>
<div class="stage">
  <div class="chip tl"><b id="rpm">—</b><s>Tốc độ quạt</s></div>
  <div class="chip tr"><b id="watt">—</b><s>Công suất</s></div>
  <div class="chip bl"><b id="ntcHot">—</b><s>NTC mặt nóng</s></div>
  <div class="chip br"><b id="ntcCold">—</b><s>NTC mặt lạnh</s></div>
  <div class="ring"><i><img class="cool" alt="PIVA B3PRO" src="https://raw.githubusercontent.com/thaibao-byte/piva-b3pro-control/main/b3pro.png"/></i></div>
</div>
<div class="st"><span class="dot" id="dot"></span><span id="conn">Chưa kết nối</span></div>
<div class="metrics">
  <div class="m"><div class="val" id="run">00:00:00</div><div class="lbl">Thời gian chạy</div></div>
  <div class="m"><div class="val" id="pps">--</div><div class="lbl">Nguồn</div></div>
  <div class="m"><button class="sw on" id="pwr" type="button"><i></i></button><div class="lbl" id="pwrTxt">Bật</div></div>
</div>
<div class="grid">
  <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
  <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Ánh sáng chảy</p></button>
  <button class="card" id="bRage" type="button"><h3>Cuồng nộ</h3><p id="rageTxt">Tắt</p></button>
  <button class="card" id="bSmart" type="button"><h3>Thông minh</h3><p id="smartTxt">Tắt</p></button>
  <button class="card" id="bProt" type="button"><h3>Cơ chế bảo vệ</h3><p id="protTxt">Nhiệt thấp ?</p></button>
  <button class="card" id="bFw" type="button"><h3>Phiên bản firmware</h3><p id="fwTxt">V212</p></button>
</div>
<div class="box">
  <div class="row">
    <button class="btn g" id="connect" type="button">Kết nối B3PRO</button>
    <button class="btn n" id="dis" type="button">Ngắt</button>
  </div>
</div>
<div class="bg" id="bg"></div><div class="sh" id="sh"><div id="body"></div></div><div class="toast" id="toast"></div>
<script>
(function(){
var SVC="49535343-fe7d-4ae5-8fa9-9fafd205e455",TX="49535343-8841-43f4-a8d4-ecbe34729bb3",RX="49535343-1e4d-4bd9-ba61-23c647249616";
var MODE=[{id:1,name:"Im lặng"},{id:2,name:"Cân bằng"},{id:3,name:"Cực lạnh"}];
var LIGHT=[{id:1,name:"Ánh sáng chảy",color:"multi",speed:1},{id:2,name:"Nhịp thở",color:"one",speed:1},{id:3,name:"Đuổi theo",color:"one",speed:1},{id:4,name:"Đệm",color:"one",speed:1},{id:5,name:"Sáng liên tục",color:"one",speed:0},{id:6,name:"Vòng sao",color:"multi",speed:1},{id:7,name:"Linh động",color:"multi",speed:1}];
var st={ok:false,dev:null,w:null,on:true,mode:3,fx:1,rage:0,pct:100,low:false,prof:"",timer:null,fw:"V212",busy:false,runAcc:0,runAt:0,ntc:null,poll:null,pollTick:0,ledSpd:2,ledHex:"#8000FF"};
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2200)}
function sum8(a){var s=0;for(var i=0;i<a.length;i++)s=(s+a[i])&255;return s}
function frame(cmd,data){data=data||[];var p=[0x20,cmd,data.length].concat(data);p.push(sum8(p));return p}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function send(cmd,data){if(!st.w)throw new Error("Chưa kết nối");var p=new Uint8Array(frame(cmd,data));try{if(st.w.properties.writeWithoutResponse)await st.w.writeValueWithoutResponse(p);else await st.w.writeValue(p)}catch(e){try{await st.w.writeValue(p)}catch(e2){throw e2}}}
function modeName(id){var m=MODE.filter(function(x){return x.id===id})[0];return m?m.name:"Cân bằng"}
function lightOf(id){return LIGHT.filter(function(x){return x.id===id})[0]||LIGHT[0]}
function lightName(id){return lightOf(id).name}
function rageLabel(){return st.rage===1?("Bật · "+st.pct+"%"):"Tắt"}
function pad(n){return (n<10?"0":"")+n}
function fmtRun(ms){var s=Math.floor(ms/1000);var h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;return pad(h)+":"+pad(m)+":"+pad(s)}
function runNow(){if(st.ok&&st.on&&st.runAt)return st.runAcc+(Date.now()-st.runAt);return st.runAcc}
function tickRun(){$("run").textContent=fmtRun(runNow())}
function startRun(){if(!st.runAt)st.runAt=Date.now()}
function stopRun(){if(st.runAt){st.runAcc+=Date.now()-st.runAt;st.runAt=0}tickRun()}
function startPoll(){stopPoll();st.pollTick=0;st.poll=setInterval(async function(){if(!st.ok||!st.w||st.busy)return;st.busy=true;try{st.pollTick=(st.pollTick+1)&3;if(st.pollTick===0){await send(0x04,[]);await send(0x0C,[])}else if(st.pollTick===1){await send(0x04,[]);await send(0x07,[])}else{await send(0x04,[])}}catch(e){}finally{st.busy=false}},500)}
function stopPoll(){if(st.poll){clearInterval(st.poll);st.poll=null}}
function resetRun(){st.runAcc=0;st.runAt=0;tickRun()}
function parseTemps(data){var a=[],i,v;for(i=0;i<data.length;i++){if(i===0||i===3||i===4)continue;v=data[i];if(v>=0&&v<=95)a.push(v)}if(data.length>=3&&data[1]<=95&&data[2]<=95){return data[1]<=data[2]?{cold:data[1],hot:data[2]}:{cold:data[2],hot:data[1]}}if(a.length>=2){a.sort(function(x,y){return x-y});return{cold:a[0],hot:a[a.length-1]}}if(a.length===1)return{cold:null,hot:a[0]};return{cold:null,hot:null}}
function hexRgb(h){h=(h||"#8000FF").replace("#","");return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function ledPayload(){var L=lightOf(st.fx),sp=st.ledSpd||2,rgb=hexRgb(st.ledHex),r=rgb[0],g=rgb[1],b=rgb[2];if(L.color==="multi")return [1,st.fx,sp,sp,0,255,0,0,0,255,0,0,0,255];return [1,st.fx,sp,sp,0,r,g,b,0,r,g,b,0,r,g,b]}
async function applyLed(){if(!st.ok){toast("Kết nối trước");return}var L=lightOf(st.fx),pl=ledPayload(),sp=st.ledSpd||2;try{await send(0x06,[1]);await sleep(40);await send(0x07,[st.fx]);await sleep(40);if(L.speed){await send(0x07,[st.fx,sp]);await sleep(40)}await send(0x08,pl);await sleep(40);await send(0x07,pl);await sleep(40);if(L.color==="one"){var rgb=hexRgb(st.ledHex);await send(0x08,[st.fx,sp,rgb[0],rgb[1],rgb[2]]);await send(0x07,[st.fx,sp,rgb[0],rgb[1],rgb[2]])}toast("Đã gửi đèn")}catch(e){toast(e.message)}}
function setProtUi(){$("protTxt").textContent=st.low?"Nhiệt thấp bật":"Nhiệt thấp tắt";$("bProt").className="card"+(st.low?" on":"")}
function save(){try{localStorage.setItem("b3pro",JSON.stringify({mode:st.mode,fx:st.fx,rage:st.rage,pct:st.pct,low:st.low,ledSpd:st.ledSpd,ledHex:st.ledHex}))}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem("b3pro")||"null");if(!j)return;if(j.mode)st.mode=j.mode;if(j.fx)st.fx=j.fx;if(j.rage!=null)st.rage=j.rage;if(j.pct)st.pct=j.pct;if(j.low!=null)st.low=j.low;if(j.ledSpd)st.ledSpd=j.ledSpd;if(j.ledHex)st.ledHex=j.ledHex}catch(e){}}
function paint(){if(st.rage){$("modeTxt").textContent="Khóa (ép xung)";$("bMode").className="card";$("bMode").style.opacity=".45"}else{$("modeTxt").textContent=modeName(st.mode);$("bMode").className="card on";$("bMode").style.opacity="1"}$("lightTxt").textContent=lightName(st.fx);$("rageTxt").textContent=rageLabel();$("bRage").className="card"+(st.rage===1?" on":"");$("smartTxt").textContent=st.rage===2?"Bật":"Tắt";$("bSmart").className="card"+(st.rage===2?" on":"");setProtUi()}
function parse(u){if(!u||u[0]!==0x20||u.length<4)return;var cmd=u[1],len=u[2],data=Array.from(u.slice(3,3+len));if(cmd===0xA5&&data.length>=7){$("rpm").textContent=(data[3]|(data[4]<<8))+" RPM";$("watt").textContent=data[0]+"W";if(data[0]>0)$("pps").textContent="PPS";var tp=parseTemps(data);if(tp.hot!=null){$("ntcHot").textContent=tp.hot+"°C";st.ntc=tp.hot}if(tp.cold!=null)$("ntcCold").textContent=tp.cold+"°C";return}if(cmd===0xA6&&data.length>=4){st.on=!!data[0];st.rage=data[1];st.mode=data[2];st.pct=data[3];$("pwr").className="sw"+(st.on?" on":"");$("pwrTxt").textContent=st.on?"Bật":"Tắt";if(st.on)startRun();else stopRun();paint();save();return}if(cmd===0xA7){if(data.length>=2)st.low=!!data[1];setProtUi();save();return}if(cmd===0xA8){if(data.length>=2&&data[1])st.fx=data[1];if(data.length>=3&&data[2]>=1&&data[2]<=4)st.ledSpd=data[2];paint()}}
function openSh(html){$("body").innerHTML=html;$("bg").className="bg show";$("sh").className="sh show"}
function closeSh(){$("bg").className="bg";$("sh").className="sh"}
function renderLed(){var L=lightOf(st.fx);var spd=L.speed?'<p class="hint">Tốc độ hiệu ứng đèn</p><div class="spd">'+[1,2,3,4].map(function(n){return "<button type='button' data-sp='"+n+"' class='"+(st.ledSpd===n?"sel":"")+"'>"+(n===1?"Chậm":n===4?"Nhanh":n)+"</button>"}).join("")+"</div>":"";var col=L.color==="one"?'<p class="hint">Lựa chọn màu sắc · Một màu</p><input id="ledc" type="color" value="'+st.ledHex+'"/>':'<p class="hint">Lựa chọn màu sắc · Nhiều màu</p>';openSh("<h3>Cài đặt hiệu ứng đèn</h3>"+LIGHT.map(function(m){return '<button class="opt'+(st.fx===m.id?" sel":"")+'" data-fx="'+m.id+'">'+m.name+"</button>"}).join("")+col+spd+"<div class='row'><button class='btn g' id='ledGo' type='button'>Gửi đèn</button><button class='btn n' id='ledOff' type='button'>Tắt đèn</button></div>");$("body").onclick=async function(e){var b=e.target.closest("[data-fx]");if(b){st.fx=+b.getAttribute("data-fx");st.prof="";paint();save();renderLed();if(st.ok)try{await send(0x06,[1]);await send(0x07,[st.fx])}catch(err){toast(err.message)}return}var s=e.target.closest("[data-sp]");if(s){st.ledSpd=+s.getAttribute("data-sp");save();renderLed();applyLed()}};var c=$("ledc");if(c)c.oninput=function(){st.ledHex=this.value;save()};$("ledGo").onclick=applyLed;$("ledOff").onclick=async function(){if(st.ok)try{await send(0x06,[0])}catch(e){toast(e.message)}}}
async function attach(dev){st.dev=dev;var server=await dev.gatt.connect();var svc=await server.getPrimaryService(SVC);st.w=await svc.getCharacteristic(TX);var n=await svc.getCharacteristic(RX);await n.startNotifications();n.addEventListener("characteristicvaluechanged",function(ev){parse(new Uint8Array(ev.target.value.buffer))});dev.addEventListener("gattserverdisconnected",function(){stopPoll();stopRun();st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Mất kết nối";toast("Mất kết nối")});st.ok=true;$("dot").className="dot ok";$("conn").textContent="Đã kết nối";toast("Đã kết nối");resetRun();startRun();startPoll();try{await send(0x04,[]);await send(0x07,[]);await send(0x0C,[])}catch(e){}}
async function ask(){if(!navigator.bluetooth){toast("Cần Chrome Android");return}try{await attach(await navigator.bluetooth.requestDevice({filters:[{name:"B3PRO"},{namePrefix:"B3PRO"}],optionalServices:[SVC,"generic_access","device_information"]}))}catch(e){toast(e.message||"Không kết nối được")}}
async function power(on){st.on=on;$("pwr").className="sw"+(on?" on":"");$("pwrTxt").textContent=on?"Bật":"Tắt";if(on)startRun();else stopRun();if(st.ok)try{await send(0x0A,[on?1:0])}catch(e){toast(e.message)}}
function armTimer(min){if(st.timer)clearTimeout(st.timer);st.timer=null;if(!min){toast("Đã đóng hẹn giờ");return}toast("Tắt sau "+min+" phút");st.timer=setTimeout(function(){power(false);toast("Đã tắt theo lịch")},min*60000)}
load();paint();setInterval(tickRun,1000);
$("connect").onclick=ask;
$("dis").onclick=function(){try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}stopPoll();stopRun();st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Chưa kết nối"};
$("back").onclick=function(){if(st.ok)$("dis").click();else ask()};
$("bg").onclick=closeSh;
$("pwr").onclick=function(){if(!st.ok){toast("Kết nối trước");return}power(!st.on)};
$("bFw").onclick=function(){openSh("<h3>Firmware</h3><p>"+st.fw+"</p>")};
$("menu").onclick=function(){openSh("<h3>Tùy chọn</h3><button class='opt r' id='mDis' type='button'>Ngắt kết nối</button><button class='opt' id='mTimer' type='button'>Tắt nguồn theo lịch trình</button>");$("mDis").onclick=function(){closeSh();$("dis").click()};$("mTimer").onclick=function(){openSh("<h3>Tắt nguồn theo lịch trình</h3>"+[0,30,60,120,180].map(function(m){return "<button class='opt' data-m='"+m+"' type='button'>"+(m?("Sau "+m+" phút"):"Đóng")+"</button>"}).join("")+"<input id='cm' type='number' min='1' max='720' value='45'/><div class='row'><button class='btn g' id='cgo' type='button'>Đặt</button></div>");$("body").onclick=function(e){var b=e.target.closest("[data-m]");if(!b)return;armTimer(+b.getAttribute("data-m"));closeSh()};$("cgo").onclick=function(){armTimer(+$("cm").value||0);closeSh()}}};
$("bMode").onclick=function(){if(st.rage){toast("Đang ép xung — tắt ép xung trước");return}openSh("<h3>Cài đặt hiệu suất</h3>"+MODE.map(function(m){return '<button class="opt'+(st.mode===m.id?" sel":"")+'" data-id="'+m.id+'">'+m.name+'</button>'}).join(""));$("body").onclick=async function(e){var b=e.target.closest("[data-id]");if(!b)return;st.mode=+b.getAttribute("data-id");st.prof="";paint();save();closeSh();if(st.ok)try{await send(0x04,[st.mode])}catch(err){toast(err.message)}}};
$("bLight").onclick=renderLed;
$("bRage").onclick=function(){
  openSh("<h3>Cuồng nộ</h3><button class='opt"+(st.rage===1?" sel":"")+"' id='rOn'>Bật</button><button class='opt"+(st.rage!==1?" sel":"")+"' id='rOff'>Tắt</button><div id='fanBox' class='"+(st.rage===1?"":" hide")+"'><p class='hint' id='pctLbl'>Tốc độ quạt "+st.pct+"%</p><input id='rng' type='range' min='80' max='100' value='"+Math.max(80,st.pct)+"'/><div class='row'><button class='btn g' id='apply'>Gửi % quạt</button></div></div>");
  function showFan(on){var b=$("fanBox");if(b)b.className=on?"":"hide"}
  async function setRage(on){st.rage=on?1:0;st.prof="";paint();save();showFan(on);if(!st.ok){toast("Kết nối trước");return}try{await send(0x09,[on?1:0]);await sleep(60);if(on){await send(0x05,[st.pct]);await sleep(40);await send(0x09,[2,st.pct]);await sleep(40);await send(0x05,[1,st.pct])}}catch(e){toast(e.message)}}
  $("rOn").onclick=function(){setRage(true)};
  $("rOff").onclick=function(){setRage(false)};
  var rng=$("rng");if(rng)rng.oninput=function(){$("pctLbl").textContent="Tốc độ quạt "+this.value+"%";st.pct=+this.value};
  $("apply").onclick=async function(){if(st.rage!==1){toast("Bật Cuồng nộ trước");return}if(!st.ok){toast("Kết nối trước");return}st.pct=+$("rng").value;paint();save();try{await send(0x09,[1]);await sleep(50);await send(0x05,[st.pct]);await sleep(40);await send(0x09,[2,st.pct]);await sleep(40);await send(0x05,[1,st.pct]);toast("Đã gửi quạt "+st.pct+"%")}catch(e){toast(e.message)}};
};
$("bSmart").onclick=async function(){
  if(!st.ok){toast("Kết nối trước");return}
  var on=st.rage!==2;
  st.rage=on?2:0;st.prof="";paint();save();
  try{await send(0x09,[on?2:0]);toast(on?"Đã bật Thông minh":"Đã tắt Thông minh")}catch(e){toast(e.message)}
};
$("bProt").onclick=function(){openSh("<h3>Cơ chế bảo vệ</h3><button class='opt' id='lon'>Bật nhiệt thấp</button><button class='opt' id='loff'>Tắt nhiệt thấp</button>");$("lon").onclick=async function(){if(st.ok)try{await send(0x0C,[1])}catch(e){toast(e.message)}};$("loff").onclick=async function(){if(st.ok)try{await send(0x0C,[0])}catch(e){toast(e.message)}}};
})();
</script>
