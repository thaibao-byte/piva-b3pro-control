<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>B3PRO Lab</title>
<style>
:root{--bg:#07090f;--card:#12151e;--line:#1e2433;--txt:#e8edf7;--dim:#8b93a7;--cy:#2ee6ff;--ok:#22d37a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;background:radial-gradient(120% 55% at 50% -8%,#1a2744 0%,var(--bg) 52%)}
button,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.brand{font-size:10px;letter-spacing:.18em;color:var(--cy);font-weight:800}
.top h1{margin:0;font-size:15px;font-weight:800}
.ib{width:36px;height:36px;border:0;background:0;font-size:22px;color:var(--txt)}
.stage{position:relative;width:280px;height:268px;margin:0 auto}
.ring{position:absolute;left:36px;top:18px;width:208px;height:208px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff3b4a,#ffb000,#2ee6ff,#7a5cff,#ff3b4a);box-shadow:0 0 26px rgba(46,230,255,.2)}
.ring i{position:absolute;inset:8px;border-radius:50%;background:#0b0d14;padding:8px;display:block}
.cool{width:100%;height:100%;object-fit:contain}
.ring.fx-flow::before{animation:spin var(--ring-spd,3.2s) linear infinite}
.ring.fx-chase::before{animation:spin var(--ring-spd,2s) linear infinite;filter:saturate(1.3)}
.ring.fx-star::before{animation:spin var(--ring-spd,2.8s) linear infinite}
.ring.fx-breath::before,.ring.fx-soft::before{animation:breath var(--ring-spd,2.6s) ease-in-out infinite;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 28px var(--ring-col,#8000FF)}
.ring.fx-solid::before{animation:none;background:var(--ring-col,#8000FF)!important;box-shadow:0 0 22px var(--ring-col,#8000FF)}
.ring.fx-off::before{animation:none!important;background:#252a38!important;box-shadow:none;opacity:.3}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.3;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
.chip{position:absolute;min-width:72px;padding:6px 8px;background:rgba(12,16,24,.88);border:1px solid var(--line);border-radius:12px;text-align:center;backdrop-filter:blur(8px)}
.chip b{display:block;font-size:12px;font-weight:800}.chip s{display:block;text-decoration:none;color:var(--dim);font-size:9px;margin-top:1px}
.tl{left:0;top:28px}.tr{right:0;top:28px}.bl{left:0;bottom:22px}.br{right:0;bottom:22px}
.st{display:flex;justify-content:center;gap:6px;align-items:center;font-weight:700;margin:-4px 0 6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4154}.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 6px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.val{font-weight:800;font-size:13px}.lbl{color:var(--dim);font-size:9px;margin-top:2px}
.sw{width:42px;height:24px;border:0;border-radius:99px;background:#2a3142;position:relative;margin:0 auto}
.sw.on{background:var(--ok)}.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}.sw.on i{left:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:68px;color:var(--txt)}
.card.on{border-color:var(--cy)}
.card h3{margin:0 0 3px;font-size:13px;color:#fff}.card p{margin:0;color:var(--dim);font-size:12px}
.box{padding:2px 12px 28px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.g{background:linear-gradient(90deg,#ff3b4a,#ff7a3a);color:#fff}.n{background:#1a1f2b;border:1px solid var(--line)}
.r{color:#ff6b76}
.hint{color:var(--dim);font-size:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px;max-width:90%;border:1px solid var(--line)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);background:#0e121a;border-radius:20px 20px 0 0;z-index:50;padding:10px 16px 28px;transition:.2s;max-height:88dvh;overflow:auto;border:1px solid var(--line)}.sh.show{transform:translate(-50%,0)}
.sh h3{margin:8px 0 4px}
.opt{display:block;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:0;text-align:left;color:var(--txt)}.opt.sel{color:var(--cy);font-weight:700}
input[type=range]{width:100%;accent-color:var(--cy)}
.spd{display:flex;gap:6px;margin:8px 0}
.spd button{flex:1;border:1px solid var(--line);background:#1a1f2b;border-radius:10px;padding:8px 0;font-size:12px}
.spd button.sel{border-color:var(--cy);color:var(--cy)}
.hide{display:none!important}
.chart-wrap{margin:4px 12px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.chart-wrap .ch-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700}
.chart-wrap .leg{display:flex;gap:10px;font-size:10px;color:var(--dim)}
.chart-wrap .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chart-wrap canvas{width:100%;height:120px;display:block}
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:12px 0}
.wheel-box{position:relative;width:220px;height:220px}
#cWheel{width:220px;height:220px;border-radius:50%;touch-action:none;display:block}
.wheel-dot{position:absolute;width:18px;height:18px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000,0 2px 8px rgba(0,0,0,.45);pointer-events:none;transform:translate(-50%,-50%);left:50%;top:50%}
.wheel-preview{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
.step{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#1a1f2b;font-size:20px;font-weight:800}
.step .num{min-width:72px;text-align:center;font-size:22px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.seg .cell{background:#12151e;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.seg .cell span{display:block;font-size:10px;color:var(--dim);margin-bottom:4px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.fwline{font-size:11px;color:var(--dim);text-align:center;padding:4px 12px 8px}
</style>
</head>
<body>
<div class="top">
  <button class="ib" id="back" type="button">‹</button>
  <div><div class="brand">B3PRO LAB</div><h1>Điều khiển sò</h1></div>
  <button class="ib" id="menu" type="button">⋮</button>
</div>
<div class="stage">
  <div class="chip tl"><b id="rpm">—</b><s>Tốc độ quạt</s></div>
  <div class="chip tr"><b id="watt">—</b><s>Công suất</s></div>
  <div class="chip bl"><b id="ntcHot">—</b><s>NTC mặt nóng</s></div>
  <div class="chip br"><b id="ntcCold">—</b><s>NTC mặt lạnh</s></div>
  <div class="ring"><i><img class="cool" alt="B3PRO" src="https://raw.githubusercontent.com/thaibao-byte/piva-b3pro-control/main/b3pro.png"/></i></div>
</div>
<div class="st"><span class="dot" id="dot"></span><span id="conn">Chưa kết nối</span></div>
<div class="fwline" id="fwLine">Firmware: —</div>
<div class="metrics">
  <div class="m"><div class="val" id="run">00:00:00</div><div class="lbl">Thời gian chạy</div></div>
  <div class="m"><div class="val" id="pps">--</div><div class="lbl">Nguồn</div></div>
  <div class="m"><button class="sw" id="pwr" type="button"><i></i></button><div class="lbl" id="pwrTxt">Tắt</div><div class="lbl" id="timerLeft" style="color:var(--cy);min-height:12px"></div></div>
</div>
<div class="chart-wrap">
  <div class="ch-title"><span>Biểu đồ nhiệt độ</span><div class="leg"><span><i style="background:#ff3b4a"></i>Nóng</span><span><i style="background:#2ee6ff"></i>Lạnh</span></div></div>
  <canvas id="tChart" width="400" height="120"></canvas>
</div>
<div class="grid">
  <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
  <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Ánh sáng chảy</p></button>
  <button class="card" id="bRage" type="button"><h3>Cuồng nộ</h3><p id="rageTxt">Tắt</p></button>
  <button class="card" id="bSmart" type="button"><h3>Thông minh</h3><p id="smartTxt">Tắt</p></button>
  <button class="card" id="bProt" type="button"><h3>Cơ chế bảo vệ</h3><p id="protTxt">Nhiệt thấp ?</p></button>
  <button class="card" id="bTimer" type="button"><h3>Hẹn giờ tắt</h3><p id="timerTxt">Tắt</p></button>
</div>
<div class="box" id="connBox">
  <div class="row"><button class="btn g" id="connect" type="button">Kết nối B3PRO</button></div>
</div>
<div class="bg" id="bg"></div>
<div class="sh" id="sh"><div id="body"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var SVC="49535343-fe7d-4ae5-8fa9-9fafd205e455",TX="49535343-8841-43f4-a8d4-ecbe34729bb3",RX="49535343-1e4d-4bd9-ba61-23c647249616";
var MODE=[{id:1,name:"Im lặng"},{id:2,name:"Cân bằng"},{id:3,name:"Cực lạnh"}];
var LIGHT=[{id:1,name:"Ánh sáng chảy",color:"multi",speed:1},{id:2,name:"Nhịp thở",color:"one",speed:1},{id:3,name:"Đuổi theo",color:"one",speed:1},{id:4,name:"Ánh sáng mềm",color:"one",speed:1},{id:5,name:"Sáng liên tục",color:"one",speed:0},{id:6,name:"Ánh sao",color:"multi",speed:1},{id:7,name:"Linh động",color:"multi",speed:1}];
var st={ok:false,dev:null,w:null,on:false,mode:3,fx:1,rage:0,pct:100,low:false,timer:null,timerEnd:0,fw:"V212",busy:false,holdUntil:0,runAcc:0,runAt:0,poll:null,ledSpd:3,ledHex:"#8000FF",ledOn:true,ledLock:false,q:[],qRun:false};
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2000)}
function sum8(a){var s=0;for(var i=0;i<a.length;i++)s=(s+a[i])&255;return s}
function frame(cmd,data){data=data||[];var p=[0x20,cmd,data.length].concat(data);p.push(sum8(p));return p}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function modeName(id){var m=MODE.filter(function(x){return x.id===id})[0];return m?m.name:"Cân bằng"}
function lightOf(id){return LIGHT.filter(function(x){return x.id===id})[0]||{id:id,name:"Mode "+id,color:"one",speed:1}}
function lightName(id){return lightOf(id).name}
function pad(n){return (n<10?"0":"")+n}
function fmtRun(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;return pad(h)+":"+pad(m)+":"+pad(s)}
function hexRgb(h){h=(h||"#8000FF").replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function ledSp(){var sp=+st.ledSpd||3;return Math.max(1,Math.min(5,sp))}
function hsv2rgb(h,s,v){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));v=Math.max(0,Math.min(1,v));var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function enqueue(fn){return new Promise(function(resolve,reject){st.q.push({fn:fn,resolve:resolve,reject:reject});drainQ()})}
async function drainQ(){if(st.qRun||!st.q.length)return;st.qRun=true;while(st.q.length){var job=st.q.shift();try{await job.fn();job.resolve()}catch(e){job.reject(e)}}st.qRun=false}
async function send(cmd,data){if(!st.w)throw new Error("Chưa kết nối");var p=new Uint8Array(frame(cmd,data));try{if(st.w.properties.writeWithoutResponse)await st.w.writeValueWithoutResponse(p);else await st.w.writeValue(p)}catch(e){try{await st.w.writeValue(p)}catch(e2){throw e2}}}
async function sendQ(cmd,data,gap){return enqueue(async function(){await send(cmd,data);if(gap)await sleep(gap)})}
function runNow(){if(st.ok&&st.on&&st.runAt)return st.runAcc+(Date.now()-st.runAt);return st.runAcc}
function tickRun(){$("run").textContent=fmtRun(runNow());paintTimer()}
function paintTimer(){var el=$("timerLeft"),tx=$("timerTxt");if(!st.timerEnd){if(el)el.textContent="";if(tx)tx.textContent="Tắt";return}var left=Math.max(0,st.timerEnd-Date.now());if(left<=0){if(el)el.textContent="";st.timerEnd=0;if(tx)tx.textContent="Tắt";return}var sec=Math.ceil(left/1000),h=Math.floor(sec/3600);sec%=3600;var m=Math.floor(sec/60);sec%=60;var str=h?(pad(h)+":"+pad(m)+":"+pad(sec)):(pad(m)+":"+pad(sec));if(el)el.textContent="Tắt sau "+str;if(tx)tx.textContent=str}
function startRun(){if(!st.runAt)st.runAt=Date.now()}
function stopRun(){if(st.runAt){st.runAcc+=Date.now()-st.runAt;st.runAt=0}tickRun()}
function resetRun(){st.runAcc=0;st.runAt=0;tickRun()}
function startPoll(){stopPoll();st.poll=setInterval(async function(){if(!st.ok||!st.w||st.ledLock||st.qRun||st.q.length)return;if(Date.now()<st.holdUntil)return;try{await send(0x07,[])}catch(e){}},900)}
function stopPoll(){if(st.poll){clearInterval(st.poll);st.poll=null}}
function parseTemps(data){if(data.length>=3&&data[1]<=95&&data[2]<=95)return data[1]<=data[2]?{cold:data[1],hot:data[2]}:{cold:data[2],hot:data[1]};var a=[];for(var i=0;i<data.length;i++){if(i===0||i===3||i===4)continue;if(data[i]>=0&&data[i]<=95)a.push(data[i])}if(a.length>=2){a.sort(function(x,y){return x-y});return{cold:a[0],hot:a[a.length-1]}}return{cold:null,hot:a[0]||null}}
async function applyLed(){if(!st.ok){toast("Kết nối trước");return}if(st.ledLock)return;st.ledLock=true;st.holdUntil=Date.now()+3500;stopPoll();var L=lightOf(st.fx),fx=st.fx|0,sp=ledSp();try{if(st.ledOn){await sendQ(0x06,[1],40);await sendQ(0x07,[fx],70);if(L.speed)await sendQ(0x07,[fx,sp],60);if(L.color==="one"){var rgb=hexRgb(st.ledHex),r=rgb[0],g=rgb[1],b=rgb[2];await sendQ(0x08,[1,fx,sp,sp,0,r,g,b,0,r,g,b,0,0],50);await sendQ(0x08,[1,fx,sp,1,4,0,r,g,b,0,r,g,b,0],40)}toast(lightName(fx)+(L.color==="one"?(" · "+st.ledHex):""))}else{await sendQ(0x06,[0],40);toast("Đã tắt đèn")}catch(e){toast(e.message)}finally{st.ledLock=false;st.holdUntil=Date.now()+800;if(st.ok)startPoll();paint()}}
function setProtUi(){$("protTxt").textContent=st.low?"Nhiệt thấp bật":"Nhiệt thấp tắt";$("bProt").className="card"+(st.low?" on":"")}
function save(){try{localStorage.setItem("b3pro",JSON.stringify({mode:st.mode,fx:st.fx,pct:st.pct,low:st.low,ledSpd:st.ledSpd,ledHex:st.ledHex,ledOn:st.ledOn}))}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem("b3pro")||"null");if(!j)return;if(j.mode)st.mode=j.mode;if(j.fx)st.fx=j.fx;if(j.pct)st.pct=j.pct;if(j.low!=null)st.low=j.low;if(j.ledSpd)st.ledSpd=j.ledSpd;if(j.ledHex)st.ledHex=j.ledHex;if(j.ledOn!=null)st.ledOn=j.ledOn}catch(e){}}
function ringSpd(){return {1:"5.5s",2:"4.2s",3:"3.2s",4:"2.2s",5:"1.3s"}[ledSp()]||"3.2s"}
function paintRing(){var el=document.querySelector(".ring");if(!el)return;el.className="ring";if(!st.ledOn){el.classList.add("fx-off");return}el.style.setProperty("--ring-spd",ringSpd());el.style.setProperty("--ring-col",st.ledHex||"#8000FF");var map={1:"fx-flow",2:"fx-breath",3:"fx-chase",4:"fx-soft",5:"fx-solid",6:"fx-star",7:"fx-flow"};el.classList.add(map[st.fx]||"fx-flow");if(lightOf(st.fx).color==="multi")el.style.removeProperty("--ring-col")}
function paint(){if(st.rage===1){$("modeTxt").textContent="Khóa · Cuồng nộ";$("bMode").className="card";$("bMode").style.opacity=".45"}else if(st.rage===2){$("modeTxt").textContent="Khóa · Thông minh";$("bMode").className="card";$("bMode").style.opacity=".45"}else{$("modeTxt").textContent=modeName(st.mode);$("bMode").className="card on";$("bMode").style.opacity="1"}$("lightTxt").textContent=st.ledOn?lightName(st.fx):"Tắt";$("rageTxt").textContent=st.rage===1?("Bật · "+st.pct+"%"):"Tắt";$("bRage").className="card"+(st.rage===1?" on":"");$("smartTxt").textContent=st.rage===2?"Bật":"Tắt";$("bSmart").className="card"+(st.rage===2?" on":"");setProtUi();paintRing();paintTimer();$("fwLine").textContent="Firmware: "+st.fw+" · YiChip";var box=$("connBox");if(box)box.className=st.ok?"box hide":"box"}
function parse(u){if(!u||u[0]!==0x20||u.length<4)return;var cmd=u[1],len=u[2],data=Array.from(u.slice(3,3+len));if(cmd===0xA5&&data.length>=7){var watt=data[0]|0,rpm=(data[3]|(data[4]<<8));$("rpm").textContent=rpm+" RPM";$("watt").textContent=watt+"W";if(watt>0)$("pps").textContent="PPS";else if(!st.on)$("pps").textContent="--";var tp=parseTemps(data);if(tp.hot!=null)$("ntcHot").textContent=tp.hot+"°C";if(tp.cold!=null)$("ntcCold").textContent=tp.cold+"°C";pushTemp(tp.hot,tp.cold);if(Date.now()>=st.holdUntil){if(watt>0||rpm>40){if(!st.on){st.on=true;$("pwr").className="sw on";$("pwrTxt").textContent="Bật";startRun()}}else if(watt===0&&rpm===0){if(st.on){st.on=false;$("pwr").className="sw";$("pwrTxt").textContent="Tắt";stopRun()}}}return}if(cmd===0xA6&&data.length>=4){st.on=!!data[0];var rg=data[1]|0;if(rg>2)rg=0;var md=data[2]|0,pct=data[3]|0;if(Date.now()>=st.holdUntil){st.rage=rg;if(rg===0&&md>=1&&md<=3)st.mode=md;if(rg===1&&pct>=80&&pct<=100)st.pct=pct}$("pwr").className="sw"+(st.on?" on":"");$("pwrTxt").textContent=st.on?"Bật":"Tắt";if(st.on)startRun();else stopRun();paint();save();return}if(cmd===0xA7){if(data.length>=2)st.low=!!data[1];setProtUi();save();return}if(cmd===0xA8){if(Date.now()<st.holdUntil)return;if(data.length>=1)st.ledOn=!!data[0];if(data.length>=2&&data[1]>=1&&data[1]<=7)st.fx=data[1];if(data.length>=3&&data[2]>=1&&data[2]<=5)st.ledSpd=data[2];paint()}}
function openSh(html){$("body").innerHTML=html;$("bg").className="bg show";$("sh").className="sh show"}
function closeSh(){$("bg").className="bg";$("sh").className="sh"}
function renderLed(){var L=lightOf(st.fx);var list=LIGHT.map(function(m){return '<button class="opt'+(st.fx===m.id?" sel":"")+'" data-fx="'+m.id+'">'+m.name+(m.color==="one"?" · chỉnh màu":" · multi")+'</button>'}).join("");var wheel=L.color==="one"?('<p class="hint">Bánh xe màu (chỉ mode 1 màu)</p><div class="wheel-wrap"><div class="wheel-box"><canvas id="cWheel" width="220" height="220"></canvas><div class="wheel-dot" id="cDot"></div></div><input id="cBri" type="range" min="20" max="100" value="100"/><div class="wheel-preview" id="cPrev" style="background:'+st.ledHex+'">'+st.ledHex+'</div></div>'):'<p class="hint">Mode multi — sò tự chạy, không chỉnh màu lẻ</p>';var spd=L.speed?('<p class="hint">Tốc độ (firmware có thể bỏ qua)</p><div class="spd">'+[1,2,3,4,5].map(function(n){return "<button type='button' data-sp='"+n+"' class='"+(ledSp()===n?"sel":"")+"'>"+n+"</button>"}).join("")+"</div>"):"";openSh("<h3>Hiệu ứng ánh sáng</h3><div class='tog'><span>Đèn LED</span><button class='sw"+(st.ledOn?" on":"")+"' id='ledTog' type='button'><i></i></button></div>"+list+wheel+spd+"<div class='row'><button class='btn g' id='ledGo' type='button'>Áp dụng</button></div><p class='hint'>B3PRO chắc chắn đổi được 7 mode. RGB/tốc độ tùy firmware.</p>");function paintWheel(){var cv=$("cWheel");if(!cv)return;var ctx=cv.getContext("2d"),R=110,cx=110,cy=110,img=ctx.createImageData(220,220),d=img.data;for(var y=0;y<220;y++)for(var x=0;x<220;x++){var dx=x-cx,dy=y-cy,rad=Math.sqrt(dx*dx+dy*dy),i=(y*220+x)*4;if(rad>R){d[i+3]=0;continue}var rgb=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,rad/R,1);d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255}ctx.putImageData(img,0,0)}function setColor(hex){st.ledHex=hex.toUpperCase();st.ledOn=true;save();paintRing();var p=$("cPrev");if(p){p.style.background=st.ledHex;p.textContent=st.ledHex}}function pick(cx,cy){var cv=$("cWheel");if(!cv)return;var r=cv.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,dx=x-110,dy=y-110,rad=Math.sqrt(dx*dx+dy*dy);if(rad>110){dx*=110/rad;dy*=110/rad;rad=110}var bri=($("cBri")?+$("cBri").value:100)/100;var rgb=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,rad/110,bri);var hex="#"+("0"+rgb[0].toString(16)).slice(-2)+("0"+rgb[1].toString(16)).slice(-2)+("0"+rgb[2].toString(16)).slice(-2);setColor(hex);var dot=$("cDot");if(dot){dot.style.left=(110+dx)+"px";dot.style.top=(110+dy)+"px"}}paintWheel();var cv=$("cWheel"),down=false;if(cv){cv.addEventListener("pointerdown",function(e){down=true;cv.setPointerCapture(e.pointerId);pick(e.clientX,e.clientY);e.preventDefault()});cv.addEventListener("pointermove",function(e){if(down){pick(e.clientX,e.clientY);e.preventDefault()}});cv.addEventListener("pointerup",function(){down=false;if(st.ok)applyLed()})}var bri=$("cBri");if(bri)bri.oninput=function(){var rgb=hexRgb(st.ledHex),mx=Math.max(rgb[0],rgb[1],rgb[2],1),f=+this.value/100;setColor("#"+("0"+Math.round(rgb[0]/mx*255*f).toString(16)).slice(-2)+("0"+Math.round(rgb[1]/mx*255*f).toString(16)).slice(-2)+("0"+Math.round(rgb[2]/mx*255*f).toString(16)).slice(-2))};$("body").onclick=function(e){var b=e.target.closest("[data-fx]");if(b){st.fx=+b.getAttribute("data-fx");st.ledOn=true;save();paint();renderLed();if(st.ok)applyLed();return}var sp=e.target.closest("[data-sp]");if(sp){st.ledSpd=+sp.getAttribute("data-sp");save();paintRing();renderLed();if(st.ok)applyLed();return}};$("ledTog").onclick=function(){st.ledOn=!st.ledOn;save();paint();if(st.ok)applyLed();renderLed()};$("ledGo").onclick=function(){if(st.ok)applyLed()}}
function renderRage(){openSh("<h3>Cuồng nộ</h3><div class='tog'><span>Bật cuồng nộ</span><button class='sw"+(st.rage===1?" on":"")+"' id='rTog' type='button'><i></i></button></div><p class='hint'>Tốc độ quạt (80–100%)</p><div class='step'><button type='button' id='rMinus'>−</button><div class='num' id='rNum'>"+st.pct+"%</div><button type='button' id='rPlus'>+</button></div><input id='rRange' type='range' min='80' max='100' value='"+Math.max(80,st.pct)+"'/><div class='row'><button class='btn g' id='rApply' type='button'>Gửi</button></div>");function showPct(){$("rNum").textContent=st.pct+"%";$("rRange").value=st.pct;$("rageTxt").textContent=st.rage===1?("Bật · "+st.pct+"%"):"Tắt"}async function setOn(on){if(!st.ok){toast("Kết nối trước");return}st.holdUntil=Date.now()+5000;try{if(on){if(st.rage===2){await sendQ(0x09,[0],100)}st.rage=1;paint();await sendQ(0x09,[1],100);await sendQ(0x05,[st.pct],60);await sendQ(0x09,[1],40)}else{st.rage=0;paint();await sendQ(0x09,[0],100);await sendQ(0x04,[st.mode>=1&&st.mode<=3?st.mode:3],40)}save();toast(on?"Cuồng nộ ON":"Cuồng nộ OFF")}catch(e){toast(e.message)}renderRage()}$("rTog").onclick=function(){setOn(st.rage!==1)};$("rMinus").onclick=function(){st.pct=Math.max(80,st.pct-1);showPct()};$("rPlus").onclick=function(){st.pct=Math.min(100,st.pct+1);showPct()};$("rRange").oninput=function(){st.pct=+this.value;showPct()};$("rApply").onclick=async function(){if(!st.ok){toast("Kết nối trước");return}if(st.rage!==1){await setOn(true);return}st.holdUntil=Date.now()+3000;try{await sendQ(0x09,[1],50);await sendQ(0x05,[st.pct],40);toast("Quạt "+st.pct+"%");save();paint()}catch(e){toast(e.message)}}}
function renderTimer(){var th=0,tm=30,ts=0;if(st.timerEnd){var left=Math.max(0,st.timerEnd-Date.now());var sec=Math.ceil(left/1000);th=Math.floor(sec/3600);sec%=3600;tm=Math.floor(sec/60);ts=sec%60}openSh("<h3>Hẹn giờ tắt</h3><div class='seg'><div class='cell'><span>Giờ</span><div class='step' style='margin:0'><button type='button' data-u='h' data-d='-1'>−</button><div class='num' id='tH'>"+th+"</div><button type='button' data-u='h' data-d='1'>+</button></div></div><div class='cell'><span>Phút</span><div class='step' style='margin:0'><button type='button' data-u='m' data-d='-1'>−</button><div class='num' id='tM'>"+tm+"</div><button type='button' data-u='m' data-d='1'>+</button></div></div><div class='cell'><span>Giây</span><div class='step' style='margin:0'><button type='button' data-u='s' data-d='-1'>−</button><div class='num' id='tS'>"+ts+"</div><button type='button' data-u='s' data-d='1'>+</button></div></div></div><div class='row'><button class='btn g' id='tGo' type='button'>Đặt hẹn giờ</button><button class='btn n' id='tCancel' type='button'>Huỷ</button></div><p class='hint' id='tHint'>"+(st.timerEnd?"Đang hẹn giờ":"Chưa hẹn giờ")+"</p>");function clamp(){th=Math.max(0,Math.min(12,th));tm=Math.max(0,Math.min(59,tm));ts=Math.max(0,Math.min(59,ts));$("tH").textContent=th;$("tM").textContent=tm;$("tS").textContent=ts}$("body").onclick=function(e){var b=e.target.closest("[data-u]");if(!b)return;var u=b.getAttribute("data-u"),d=+b.getAttribute("data-d");if(u==="h")th+=d;else if(u==="m")tm+=d;else ts+=d;clamp()};$("tGo").onclick=function(){var total=th*3600+tm*60+ts;if(total<=0){toast("Chọn thời gian > 0");return}if(st.timer)clearTimeout(st.timer);st.timerEnd=Date.now()+total*1000;st.timer=setTimeout(function(){st.timer=null;st.timerEnd=0;paintTimer();power(false);toast("Đã tắt theo lịch")},total*1000);paint();toast("Đã hẹn "+pad(th)+":"+pad(tm)+":"+pad(ts));closeSh()};$("tCancel").onclick=function(){if(st.timer)clearTimeout(st.timer);st.timer=null;st.timerEnd=0;paint();toast("Đã huỷ hẹn giờ");closeSh()}}
var hist={hot:[],cold:[],max:120};
function pushTemp(h,c){hist.hot.push(h!=null?h:(hist.hot.length?hist.hot[hist.hot.length-1]:null));hist.cold.push(c!=null?c:(hist.cold.length?hist.cold[hist.cold.length-1]:null));if(hist.hot.length>hist.max){hist.hot.shift();hist.cold.shift()}if(!drawChart._raf)drawChart._raf=requestAnimationFrame(function(){drawChart._raf=0;drawChart()})}
function drawChart(){var cv=$("tChart");if(!cv)return;var dpr=window.devicePixelRatio||1,w=cv.clientWidth||360,h=120;if(cv.width!==Math.floor(w*dpr)||cv.height!==Math.floor(h*dpr)){cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr)}var ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);var padL=28,padR=8,padT=8,padB=16,iw=w-padL-padR,ih=h-padT-padB;var vals=hist.hot.concat(hist.cold).filter(function(v){return v!=null});var ymin=0,ymax=60;if(vals.length){ymin=Math.max(0,Math.min.apply(null,vals)-3);ymax=Math.min(100,Math.max.apply(null,vals)+3);if(ymax-ymin<10)ymax=ymin+10}function yx(v){return padT+ih*(1-(v-ymin)/(ymax-ymin||1))}function xx(i,n){return padL+(n<=1?iw/2:iw*i/(n-1))}ctx.strokeStyle="#1e2433";ctx.lineWidth=1;for(var g=0;g<4;g++){var gy=padT+ih*g/3;ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(padL+iw,gy);ctx.stroke();ctx.fillStyle="#8b93a7";ctx.font="9px sans-serif";ctx.textAlign="right";ctx.fillText(Math.round(ymax-(ymax-ymin)*g/3)+"°",padL-4,gy+3)}function series(arr,color){var pts=[];for(var i=0;i<arr.length;i++)if(arr[i]!=null)pts.push({x:xx(i,arr.length),y:yx(arr[i])});if(pts.length<2)return;ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2.4;ctx.lineJoin="round";ctx.lineCap="round";ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length-1;i++){var xc=(pts[i].x+pts[i+1].x)/2,yc=(pts[i].y+pts[i+1].y)/2;ctx.quadraticCurveTo(pts[i].x,pts[i].y,xc,yc)}ctx.quadraticCurveTo(pts[pts.length-2].x,pts[pts.length-2].y,pts[pts.length-1].x,pts[pts.length-1].y);ctx.stroke();ctx.beginPath();ctx.fillStyle=color;ctx.arc(pts[pts.length-1].x,pts[pts.length-1].y,3.5,0,Math.PI*2);ctx.fill()}series(hist.hot,"#ff3b4a");series(hist.cold,"#2ee6ff")}
async function attach(dev){st.dev=dev;var server=await dev.gatt.connect();var svc=await server.getPrimaryService(SVC);st.w=await svc.getCharacteristic(TX);var n=await svc.getCharacteristic(RX);await n.startNotifications();n.addEventListener("characteristicvaluechanged",function(ev){parse(new Uint8Array(ev.target.value.buffer))});dev.addEventListener("gattserverdisconnected",function(){stopPoll();stopRun();st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Mất kết nối";paint();toast("Mất kết nối")});st.ok=true;st.holdUntil=Date.now()+1000;st.on=false;$("pwr").className="sw";$("pwrTxt").textContent="…";$("dot").className="dot ok";$("conn").textContent="Đã kết nối";resetRun();paint();startPoll();try{await sendQ(0x07,[],30);await sendQ(0x0C,[],30)}catch(e){}toast("Đã kết nối")}
async function ask(){if(!navigator.bluetooth){toast("Cần Chrome Android");return}try{await attach(await navigator.bluetooth.requestDevice({filters:[{name:"B3PRO"},{namePrefix:"B3PRO"}],optionalServices:[SVC,"generic_access","device_information"]}))}catch(e){toast(e.message||"Không kết nối được")}}
function disconnect(){try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}stopPoll();stopRun();st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Chưa kết nối";paint()}

$("menu").onclick=function(){openSh("<h3>Tùy chọn</h3>"+(st.ok?"<button class='opt r' id='mDis' type='button'>Ngắt kết nối</button>":"")+"<button class='opt' id='mReset' type='button'>Reset sò (khi lỗi)</button><button class='opt' id='mFw' type='button'>Thông tin firmware</button>");var d=$("mDis");if(d)d.onclick=function(){closeSh();disconnect()};$("mFw").onclick=function(){openSh("<h3>Firmware</h3><p class='hint'>Phiên bản: <b>"+st.fw+"</b><br>Chip: YiChip<br>LED: 7 mode cố định. RGB/tốc độ tùy bản chip.</p>")};$("mReset").onclick=async function(){if(!st.ok){toast("Kết nối trước");return}closeSh();st.holdUntil=Date.now()+4000;try{await sendQ(0x0A,[0],200);await sendQ(0x06,[0],120);await sendQ(0x09,[0],120);await sendQ(0x04,[st.mode>=1&&st.mode<=3?st.mode:3],80);await sendQ(0x07,[1],60);await sendQ(0x0C,[st.low?1:0],40);st.rage=0;st.on=false;st.ledOn=false;paint();toast("Đã reset")}catch(e){toast(e.message)}}};
$("bMode").onclick=function(){if(!st.ok){toast("Kết nối trước");return}if(st.rage===1){toast("Tắt Cuồng nộ trước");return}if(st.rage===2){toast("Tắt Thông minh trước");return}openSh("<h3>Hiệu suất</h3>"+MODE.map(function(m){return '<button class="opt'+(st.mode===m.id?" sel":"")+'" data-id="'+m.id+'">'+m.name+'</button>'}).join(""));$("body").onclick=async function(e){var b=e.target.closest("[data-id]");if(!b)return;st.mode=+b.getAttribute("data-id");st.holdUntil=Date.now()+3500;paint();save();closeSh();try{await sendQ(0x04,[st.mode],40);toast(modeName(st.mode))}catch(err){toast(err.message)}}};

$("bProt").onclick=function(){openSh("<h3>Cơ chế bảo vệ</h3><div class='tog'><span>Bảo vệ nhiệt thấp</span><button class='sw"+(st.low?" on":"")+"' id='pTog' type='button'><i></i></button></div><p class='hint'>Khi bật: sò tự giảm/tắt nếu mặt lạnh quá thấp (chống đọng sương). Qua BLE chỉ có công tắc này.</p>");$("pTog").onclick=async function(){if(!st.ok){toast("Kết nối trước");return}var v=!st.low;try{await sendQ(0x0C,[v?1:0],40);st.low=v;setProtUi();save();paint();toast(v?"Nhiệt thấp ON":"Nhiệt thấp OFF");$("pTog").className="sw"+(v?" on":"")}catch(e){toast(e.message)}}};
$("bTimer").onclick=renderTimer;
