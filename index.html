<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>PIVA B3PRO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body{max-width:430px;margin:0 auto;min-height:100dvh;touch-action:manipulation}
button,input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.top h1{margin:0;font-size:18px}
.ib{width:40px;height:40px;border:0;background:0;font-size:22px}
.hero{text-align:center;padding:6px 16px}
.logo{width:140px;height:140px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:38px;font-weight:800;background:conic-gradient(#ff4d4d,#ffd166,#22c55e,#38bdf8,#a78bfa,#ff4d4d)}
.st{display:flex;justify-content:center;gap:6px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:#e5e7eb;color:#fff;display:grid;place-items:center;font-size:10px}
.dot.ok{background:#22c55e}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:8px}
.val{font-weight:800;font-size:18px}
.lbl{color:#6b7280;font-size:11px}
.sw{width:46px;height:26px;border:0;border-radius:99px;background:#e5e7eb;position:relative;margin:6px auto 2px}
.sw.on{background:#22c55e}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%}
.sw.on i{left:23px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px}
.card{background:#f3f4f6;border:1.5px solid transparent;border-radius:16px;padding:14px;text-align:left}
.card.on{background:#f0fdf4;border-color:#22c55e}
.card h3{margin:0 0 4px;font-size:15px}
.card p{margin:0;color:#6b7280;font-size:13px}
.box{padding:0 12px 24px}
.warn{background:#ecfdf5;color:#065f46;border-radius:12px;padding:10px;font-size:12px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:700;font-size:13px}
.g{background:#22c55e;color:#fff}
.n{background:#f3f4f6}
.log{background:#0b1220;color:#bbf7d0;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.hint{color:#6b7280;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:80;font-size:13px}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
.bg.show{display:block}
.sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(430px,100%);background:#fff;border-radius:20px 20px 0 0;z-index:50;padding:8px 16px 24px;transition:.2s;max-height:88dvh;overflow:auto}
.sh.show{transform:translate(-50%,0)}
.opt{display:flex;justify-content:space-between;width:100%;padding:14px 0;border:0;border-bottom:1px solid #f3f4f6;background:0;text-align:left}
.opt.sel{font-weight:700}
input[type=range]{width:100%}
</style>
</head>
<body>
<div class="top"><button class="ib" id="back" type="button">‹</button><h1>B3PRO</h1><span></span></div>
<div class="hero">
  <div class="logo">A</div>
  <div class="st"><span class="dot" id="dot">✓</span><span id="conn">Chưa kết nối</span></div>
</div>
<div class="metrics">
  <div><div class="val" id="rpm">—</div><div class="lbl">Tốc độ quạt</div></div>
  <div><div class="val" id="watt">—</div><div class="lbl">Công suất</div></div>
  <div><button class="sw on" id="pwr" type="button"><i></i></button><div class="lbl" id="pwrTxt">Bật</div></div>
</div>
<div class="grid">
  <button class="card on" id="bMode" type="button"><h3>Chế độ hiệu năng</h3><p id="modeTxt">Cực lạnh</p></button>
  <button class="card" id="bLight" type="button"><h3>Hiệu ứng ánh sáng</h3><p id="lightTxt">Linh động</p></button>
  <button class="card" id="bRage" type="button"><h3>Chế độ ép xung</h3><p id="rageTxt">Đóng</p></button>
  <button class="card" id="bSmart" type="button"><h3>Điều khiển thông minh</h3><p>Đóng</p></button>
</div>
<div class="box">
  <div class="warn">Ép xung: mức = lệnh 09 (0/1/2). % quạt = lệnh 05. Máy chỉ nhận khoảng 80–100% (30 và 50 bị bỏ, 80 đổi byte 64→50).</div>
  <div class="row">
    <button class="btn g" id="connect" type="button">Kết nối B3PRO</button>
    <button class="btn n" id="dis" type="button">Ngắt</button>
    <button class="btn n" id="copy" type="button">Chép nhật ký</button>
  </div>
  <div class="hint" id="info">Chưa chọn thiết bị.</div>
  <div class="log" id="log"></div>
</div>
<div class="bg" id="bg"></div>
<div class="sh" id="sh"><div id="body"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var SVC="49535343-fe7d-4ae5-8fa9-9fafd205e455";
var TX="49535343-8841-43f4-a8d4-ecbe34729bb3";
var RX="49535343-1e4d-4bd9-ba61-23c647249616";
var OPT=[SVC,"generic_access","device_information"];
var MODE=[{id:3,name:"Cực lạnh"},{id:0,name:"Tiết kiệm"},{id:1,name:"Im lặng"},{id:2,name:"Kiểm soát nhiệt độ"}];
var LIGHT=[{id:0,name:"Linh động"},{id:1,name:"Hơi thở"},{id:2,name:"Cầu vồng"},{id:3,name:"Đa sắc PIVA"},{id:4,name:"Hiệu ứng 4"},{id:5,name:"Hiệu ứng 5"},{id:6,name:"Hiệu ứng 6"},{id:7,name:"Hiệu ứng 7"}];
var st={ok:false,dev:null,w:null,on:true,mode:3,fx:0,rage:0,pct:100};
function $(id){return document.getElementById(id)}
function log(m){var el=$("log");el.textContent+="["+new Date().toLocaleTimeString("vi-VN")+"] "+m+"\n";el.scrollTop=el.scrollHeight}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},1600)}
function hex(u){return Array.from(u).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(" ").toUpperCase()}
function sum8(a){var s=0;for(var i=0;i<a.length;i++)s=(s+a[i])&255;return s}
function frame(cmd,data){data=data||[];var p=[0x20,cmd,data.length].concat(data);p.push(sum8(p));return p}
async function send(cmd,data){
  if(!st.w)throw new Error("Chưa kết nối");
  var p=frame(cmd,data);log("Gửi "+hex(p));
  await st.w.writeValueWithoutResponse(new Uint8Array(p));
}
function rageLabel(){return st.rage===0?"Đóng":("Mức "+st.rage+" · "+st.pct+"%")}
function parse(u){
  if(!u||u[0]!==0x20||u.length<4)return;
  var cmd=u[1],len=u[2],data=Array.from(u.slice(3,3+len));
  if(cmd===0xA5&&data.length>=7){
    $("rpm").textContent=(data[3]|(data[4]<<8))+" RPM";
    $("watt").textContent=data[0]+"W";
    return;
  }
  if(cmd===0xA6&&data.length>=4){
    st.on=!!data[0];st.rage=data[1];st.mode=data[2];st.pct=data[3];
    $("rageTxt").textContent=rageLabel();
    $("bRage").className="card"+(st.rage?" on":"");
    log("A6 nguồn "+data[0]+" mức "+data[1]+" mode "+data[2]+" quạt "+data[3]+"%");
    return;
  }
  if(cmd===0x51)log("Từ chối "+hex(u));
  else log("Trả cmd="+cmd.toString(16)+" "+hex(u));
}
function openSh(html){$("body").innerHTML=html;$("bg").className="bg show";$("sh").className="sh show"}
function closeSh(){$("bg").className="bg";$("sh").className="sh"}
async function attach(dev){
  st.dev=dev;$("info").textContent="Thiết bị: "+(dev.name||"(không tên)");
  log("Chọn "+(dev.name||dev.id));
  var server=await dev.gatt.connect();
  var svc=await server.getPrimaryService(SVC);
  st.w=await svc.getCharacteristic(TX);
  var n=await svc.getCharacteristic(RX);
  await n.startNotifications();
  n.addEventListener("characteristicvaluechanged",function(ev){parse(new Uint8Array(ev.target.value.buffer))});
  st.ok=true;$("dot").className="dot ok";$("conn").textContent="Đã kết nối";toast("Đã kết nối");
  try{await send(0x04,[])}catch(e){}
}
async function ask(){
  if(!navigator.bluetooth){toast("Cần Chrome Android");return}
  try{await attach(await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:OPT}))}
  catch(e){log("Lỗi: "+(e.message||e.name||"không rõ"))}
}
$("connect").onclick=ask;
$("dis").onclick=function(){try{st.dev&&st.dev.gatt&&st.dev.gatt.disconnect()}catch(e){}st.ok=false;st.w=null;$("dot").className="dot";$("conn").textContent="Chưa kết nối"};
$("back").onclick=function(){if(st.ok)$("dis").click();else ask()};
$("copy").onclick=function(){navigator.clipboard&&navigator.clipboard.writeText($("log").textContent).then(function(){toast("Đã chép")})};
$("bg").onclick=closeSh;
$("pwr").onclick=async function(){
  if(!st.ok){toast("Kết nối trước");return}
  st.on=!st.on;$("pwr").className="sw"+(st.on?" on":"");$("pwrTxt").textContent=st.on?"Bật":"Tắt";
  try{await send(0x0A,[st.on?1:0])}catch(e){log(e.message)}
};
$("bMode").onclick=function(){
  openSh("<h3>Chế độ hiệu năng</h3>"+MODE.map(function(m){return '<button class="opt'+(st.mode===m.id?" sel":"")+'" data-id="'+m.id+'" type="button"><span>'+m.name+'</span><span>'+(st.mode===m.id?"\u2713":"")+'</span></button>'}).join(""));
  $("body").onclick=async function(e){
    var b=e.target.closest("[data-id]");if(!b)return;
    st.mode=+b.getAttribute("data-id");$("modeTxt").textContent=MODE.filter(function(x){return x.id===st.mode})[0].name;closeSh();
    if(!st.ok)return;try{await send(0x04,[st.mode])}catch(err){log(err.message)}
  };
};
$("bLight").onclick=function(){
  openSh("<h3>Hiệu ứng ánh sáng</h3>"+LIGHT.map(function(m){return '<button class="opt'+(st.fx===m.id?" sel":"")+'" data-id="'+m.id+'" type="button"><span>'+m.name+'</span><span>'+(st.fx===m.id?"\u2713":"")+'</span></button>'}).join(""));
  $("body").onclick=async function(e){
    var b=e.target.closest("[data-id]");if(!b)return;
    st.fx=+b.getAttribute("data-id");$("lightTxt").textContent=LIGHT[st.fx].name;closeSh();
    if(!st.ok)return;try{await send(0x07,[st.fx])}catch(err){log(err.message)}
  };
};
$("bRage").onclick=function(){
  openSh("<h3>Chế độ ép xung</h3><p class='hint'>Mức 09. Quạt lệnh 05, máy kẹp khoảng 80–100%.</p>"+
    "<button class='opt"+(st.rage===0?" sel":"")+"' id='r0' type='button'>Đóng</button>"+
    "<button class='opt"+(st.rage===1?" sel":"")+"' id='r1' type='button'>Mức 1</button>"+
    "<button class='opt"+(st.rage===2?" sel":"")+"' id='r2' type='button'>Mức 2</button>"+
    "<p class='hint' id='pctLbl'>Tốc độ quạt "+st.pct+"%</p><input id='rng' type='range' min='80' max='100' value='"+Math.max(80,st.pct)+"'/>"+
    "<div class='row'><button class='btn g' id='apply' type='button'>Gửi % quạt</button></div>");
  async function setLv(n){st.rage=n;$("rageTxt").textContent=rageLabel();$("bRage").className="card"+(n?" on":"");if(st.ok)try{await send(0x09,[n])}catch(e){log(e.message)}}
  $("r0").onclick=function(){setLv(0)};
  $("r1").onclick=function(){setLv(1)};
  $("r2").onclick=function(){setLv(2)};
  $("rng").oninput=function(){$("pctLbl").textContent="Tốc độ quạt "+this.value+"%";st.pct=+this.value};
  $("apply").onclick=async function(){
    st.pct=+$("rng").value;$("rageTxt").textContent=rageLabel();
    if(!st.ok)return;
    try{await send(0x05,[st.pct])}catch(e){log(e.message)}
  };
};
$("bSmart").onclick=function(){toast("PID trên máy này đang tắt")};
log("Sẵn sàng.");
})();
</script>
</body>
</html>
